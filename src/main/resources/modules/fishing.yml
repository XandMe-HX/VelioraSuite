      angler: {tier: 18, name: 'Angler Rod', gradient-from: '#FFE46A', gradient-to: '#C77828', price: 2000000, required-catches: 18000, seconds-bonus: 6, click-reduction: 11, luck: 850, max-weight: 700000, speed: 105, quest: true, aura: 'Cahaya blueprint kuno.'}
