# =========================================================
# VELIORATRADER CONFIG
# =========================================================
# Fungsi:
# - Merchant / trader eksklusif Veliora Gardens.
# - Admin bisa set maksimal banyak lokasi dengan /vtr create <id> <name>.
# - Trader muncul sebagai Villager NPC ringan, bisa diklik untuk buka GUI.
# - Item dibeli pakai coin/Vault.
#
# Command player:
# - /vtrader atau /vtr open
#
# Command admin:
# - /vtr create <id> <name>  -> simpan lokasi NPC di posisi admin
# - /vtr spawn [id]          -> spawn trader manual
# - /vtr despawn             -> hapus trader aktif
# - /vtr list                -> lihat lokasi
# - /vtr reload              -> reload config
# =========================================================

enabled: true

settings:
  auto-spawn: true
  spawn-interval-minutes: 60
  despawn-seconds: 900
  npc-name: '&6Veliora Trader'

gui:
  title: '&8Veliora Trader'
  size: 27

items:
  emerald_pack:
    enabled: true
    slot: 10
    material: EMERALD
    amount: 8
    name: '&aEmerald Pack'
    price: 5000
    lore:
      - '&7Paket emerald untuk trading.'
      - '&7Harga: &e%price% coin'

  golden_carrot:
    enabled: true
    slot: 12
    material: GOLDEN_CARROT
    amount: 32
    name: '&6Golden Carrot Bundle'
    price: 8000
    lore:
      - '&7Makanan premium untuk survival.'
      - '&7Harga: &e%price% coin'

  name_tag:
    enabled: true
    slot: 14
    material: NAME_TAG
    amount: 1
    name: '&bName Tag'
    price: 12000
    lore:
      - '&7Untuk memberi nama mob.'
      - '&7Harga: &e%price% coin'

  shulker:
    enabled: true
    slot: 16
    material: SHULKER_BOX
    amount: 1
    name: '&dShulker Box'
    price: 45000
    lore:
      - '&7Storage portable.'
      - '&7Harga: &e%price% coin'

messages:
  no-permission: '&8【&aVelioraTrader&8】 &cKamu tidak punya izin.'
  reload: '&8【&aVelioraTrader&8】 &aConfig berhasil direload.'
  spawn: '&8【&aVelioraTrader&8】 &eTrader misterius muncul di &f%location%&e! Klik NPC atau ketik &a/vtrader&e.'
  despawn: '&8【&aVelioraTrader&8】 &7Trader telah pergi.'
  no-location: '&8【&aVelioraTrader&8】 &cBelum ada lokasi trader. Buat dengan /vtr create <id> <name>.'
  location-saved: '&8【&aVelioraTrader&8】 &aLokasi &f%id% &adisimpan sebagai &f%name%&a.'
  economy-not-ready: '&8【&aVelioraTrader&8】 &cEconomy belum siap. Pastikan Vault aktif.'
  not-enough-money: '&8【&aVelioraTrader&8】 &cCoin tidak cukup. Harga: &e%price% coin&c.'
  bought: '&8【&aVelioraTrader&8】 &aKamu membeli &f%item% &adengan harga &e%price% coin&a.'
