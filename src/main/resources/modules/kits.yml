  claim-success-paid: '%prefix% &aKamu berhasil membeli kit &f%kit% &adengan harga &e%price%&a.'
  no-permission-kit: '%prefix% &cKamu belum punya akses ke kit ini.'
  cooldown: '%prefix% &cKit ini belum bisa diambil. Tunggu &f%time%&c.'
  kit-not-found: '%prefix% &cKit &f%kit% &ctidak ditemukan.'
  not-enough-space: '%prefix% &cInventory penuh. Item sisa dijatuhkan ke tanah.'
  not-enough-money: '%prefix% &cCoin kamu tidak cukup. Harga kit ini &e%price%&c. Coin kamu sekarang &e%balance%&c.'
  economy-not-ready: '%prefix% &cEconomy belum siap. Pastikan Vault dan plugin economy aktif.'
  payment-failed: '%prefix% &cPembayaran gagal. Coba lagi atau hubungi admin.'

