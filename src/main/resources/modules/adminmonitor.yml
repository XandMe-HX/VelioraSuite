settings:
  enabled: true
  prefix: '&6&l[ &e&lVELIORA &a&lMONITOR &6&l] &r'
  timezone: 'Asia/Jakarta'
  staff-permission: 'veliorasuite.staff'
  admin-permission: 'veliorasuite.adminmonitor.admin'
  notify-permission: 'veliorasuite.adminmonitor.notify'
  keep-days: 30
  storage:
    # Log disimpan ke adminmonitor.db secara batch agar tidak membebani main thread.
    flush-interval-seconds: 30
    flush-max-pending: 100
  track:
    login: true
    logout: true
    commands: true
    world-change: true
    teleport: true
    gamemode: true
    flight: true
    chat: false
  # Kosong = tidak ada aktivitas yang dikirim ke chat maupun console.
  # Semua aktivitas admin/staff tersimpan di adminmonitor.db.
  notify-events: []
  notify:
    console: false
    owner-chat: false
  sensitive-commands:
    - '/login'
    - '/l'
    - '/register'
    - '/reg'
    - '/changepass'
    - '/cpowner'
    - '/risetpw'

messages:
  no-permission: '%prefix% &cKamu tidak punya izin.'
  player-not-found: '%prefix% &cStaff &f%player% &ctidak ditemukan di log.'
  reload-success: '%prefix% &aAdminMonitor berhasil direload.'
