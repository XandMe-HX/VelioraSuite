settings:
  enabled: true
  prefix: '&8[&bAdminMonitor&8] '
  timezone: 'Asia/Jakarta'
  staff-permission: 'veliorasuite.staff'
  admin-permission: 'veliorasuite.adminmonitor.admin'
  notify-permission: 'veliorasuite.adminmonitor.notify'
  keep-days: 30
  track:
    login: true
    logout: true
    commands: true
    world-change: true
    teleport: true
    gamemode: true
    flight: true
    block-place: true
    block-break: true
    interact: true
    entity-interact: true
    entity-attack: true
    inventory: true
    item-pickup: true
    item-drop: true
    consume: true
    bucket: true
    chat: true
  # Kosong = tidak ada aktivitas yang dikirim ke chat maupun console.
  # Semua aktivitas tetap tersimpan lengkap di logs/adminmonitor-YYYY-MM-DD.yml.
  notify-events: []
  notify:
    console: false
    owner-chat: false
  sensitive-commands:
    - '/login'
    - '/l'
    - '/register'
    - '/reg'
    - '/changepass'
    - '/cpowner'
    - '/risetpw'

messages:
  no-permission: '%prefix% &cKamu tidak punya izin.'
  player-not-found: '%prefix% &cStaff &f%player% &ctidak ditemukan di log.'
  reload-success: '%prefix% &aAdminMonitor berhasil direload.'
