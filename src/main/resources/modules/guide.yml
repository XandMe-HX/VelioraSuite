          - '&f- Dilarang provokasi.'
          - '&f- Staff bisa dilaporkan jika melanggar.'
          - '&f- Jangan mengganggu player lain berlebihan.'
      6:
        title: '&cEvent'
        lines:
          - '&8[ &cEvent &8]'
          - '&f- Admin bisa memberi hadiah event.'
          - '&f- Interaksi server bisa menjadi konten.'
          - '&f- Admin akan memberi info jika event ditunda.'
          - '&f- Ikuti arahan staff saat event berjalan.'
      7:
        title: '&cSanksi'
        lines:
          - '&8[ &cSanksi &8]'
          - '&f- Pelanggaran ringan: peringatan.'
          - '&f- Pelanggaran sedang: mute, kick, atau ban sementara.'
          - '&f- Pelanggaran berat: ban.'
          - '&f- Keputusan staff bersifat final.'
      8:
        title: '&cCatatan'
        lines:
          - '&8[ &cCatatan &8]'
          - '&f- Rules bisa berubah kapan saja.'
          - '&f- Player dianggap setuju setelah bermain.'
          - '&f- Stay fair and have fun.'
          - '&f- Gunakan server dengan sopan dan sportif.'

