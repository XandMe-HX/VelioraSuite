# =========================================================
# VELIORABOSS CONFIG
# =========================================================
# Fungsi:
# - Event boss PvE dengan rarity, bossbar, skill, true damage, last hit dan top damage reward.
#
# Command admin:
# - /vbs spawn [bossId] atau /vboss spawn [bossId]
# - /vbs set <namaLokasi>      -> simpan lokasi spawn otomatis
# - /vbs delete <namaLokasi>   -> hapus lokasi
# - /vbs list                  -> lihat lokasi
# - /vbs kill                  -> hapus boss aktif
# - /vbs reload                -> reload config
# =========================================================

enabled: true

settings:
  auto-spawn: false
  spawn-interval-minutes: 120
  default-boss: ancient_guardian
  skill-interval-ticks: 120
  true-damage:
    enabled: true
    amount: 2.0

rarities:
  common:
    display: '&7Common'
    chance: 55
    multiplier: 1.0
  rare:
    display: '&aRare'
    chance: 25
    multiplier: 1.25
  epic:
    display: '&5Epic'
    chance: 12
    multiplier: 1.6
  mythic:
    display: '&dMythic'
    chance: 6
    multiplier: 2.0
  legendary:
    display: '&6Legendary'
    chance: 2
    multiplier: 2.8

skills:
  enabled: [stomp, knockback, poison_nova]
  radius: 6.0
  stomp-damage: 4.0
  knockback-power: 1.2

bosses:
  ancient_guardian:
    chance: 35
    type: ZOMBIE
    name: '&cAncient Guardian'
    health: 400
    rewards:
      last-hit-money: 1000
      top-damage-money: 2500

  frost_reaper:
    chance: 30
    type: SKELETON
    name: '&bFrost Reaper'
    health: 350
    rewards:
      last-hit-money: 900
      top-damage-money: 2200

  iron_colossus:
    chance: 20
    type: IRON_GOLEM
    name: '&fIron Colossus'
    health: 550
    rewards:
      last-hit-money: 1500
      top-damage-money: 3000

  ravager_king:
    chance: 15
    type: RAVAGER
    name: '&4Ravager King'
    health: 650
    rewards:
      last-hit-money: 1800
      top-damage-money: 3500

messages:
  no-permission: '&8【&aVelioraBoss&8】 &cKamu tidak punya izin.'
  reload: '&8【&aVelioraBoss&8】 &aConfig berhasil direload.'
  spawn: '&8【&aVelioraBoss&8】 &cBoss &f%boss% &cmuncul! Rarity: &f%rarity%'
  defeated: '&8【&aVelioraBoss&8】 &aBoss &f%boss% &aberhasil dikalahkan.'
  top-damage-reward: '&8【&aVelioraBoss&8】 &aKamu mendapat reward top damage: &e%money% coin&a.'
  last-hit-reward: '&8【&aVelioraBoss&8】 &aKamu mendapat reward last hit: &e%money% coin&a.'
  location-saved: '&8【&aVelioraBoss&8】 &aLokasi boss &f%id% &adisimpan.'
  location-deleted: '&8【&aVelioraBoss&8】 &cLokasi boss &f%id% &cdihapus.'
