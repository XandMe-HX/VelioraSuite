settings:
  enabled: true
  prefix: '&8[&aVelioraQuest&8] '
  # Quest wajib dipilih dulu dan memakai Mana dari VelioraSkills.
  require-skills-mana: true
  debug-mana: false
  gui:
    enabled: true
    title: '&8Veliora Quest'
    size: 54
  bossbar:
    enabled: true
    title: '&f%quest% &7- &a%progress%&7/&a%target% &8(&e%percent%%&8)'
    color: GREEN
    style: SEGMENTED_10
    hide-when-complete: true
  progression:
    # Mode manual: player harus pilih quest dulu lewat /quests atau /quests start <category>.
    # Mining/kill/farming/fishing tidak akan mengganti quest sendiri.
    # Setelah quest selesai, player harus pilih lagi untuk lanjut level berikutnya dan bayar Mana lagi.
    completions-per-level: 1
    max-level: 100
    auto-start-on-progress: false
    auto-restart-after-claim: false
  rewards:
    # Anti-inflasi: reward uang naik pelan dan tetap ada batas maksimal.
    give-mana-on-complete: false
    mana-reward: 0
    base-money: 1000
    money-increase-per-level: 125
    max-money: 17500
  starter:
    enabled: true
    reminder-enabled: true
    reminder-interval-seconds: 900
    claim-land-commands: ['/claim', '/lands claim', '/land claim', '/claimland']
    set-home-commands: ['/sethome', '/home set']
    starter-kit-commands: ['/kits claim starter', '/kit starter', '/kits starter']

categories:
  woodcutting:
    enabled: true
    display-name: '&dWeekly / Special'
    icon: NETHER_STAR
    # Level 1 ringan, level 50 mulai berat, level 100 butuh grind panjang.
    base-target: 192
    target-increase-per-level: 110
    materials: [OAK_LOG, SPRUCE_LOG, BIRCH_LOG, JUNGLE_LOG, ACACIA_LOG, DARK_OAK_LOG, MANGROVE_LOG, CHERRY_LOG, STRIPPED_OAK_LOG, STRIPPED_SPRUCE_LOG, STRIPPED_BIRCH_LOG, STRIPPED_JUNGLE_LOG, STRIPPED_ACACIA_LOG, STRIPPED_DARK_OAK_LOG, STRIPPED_MANGROVE_LOG, STRIPPED_CHERRY_LOG]
  mining:
    enabled: true
    display-name: '&7Mining'
    icon: IRON_PICKAXE
    # Mining adalah quest utama grind, total level 1-100 dibuat sangat panjang.
    base-target: 128
    target-increase-per-level: 80
    materials: [STONE, COBBLESTONE, DEEPSLATE, COAL_ORE, DEEPSLATE_COAL_ORE, COPPER_ORE, DEEPSLATE_COPPER_ORE, IRON_ORE, DEEPSLATE_IRON_ORE, GOLD_ORE, DEEPSLATE_GOLD_ORE, REDSTONE_ORE, DEEPSLATE_REDSTONE_ORE, LAPIS_ORE, DEEPSLATE_LAPIS_ORE, DIAMOND_ORE, DEEPSLATE_DIAMOND_ORE, EMERALD_ORE, DEEPSLATE_EMERALD_ORE, ANCIENT_DEBRIS]
  farmer:
    enabled: true
    display-name: '&eFarming'
    icon: WHEAT
    base-target: 96
    target-increase-per-level: 58
    harvest-materials: [WHEAT, CARROTS, POTATOES, BEETROOTS, SUGAR_CANE, MELON, PUMPKIN, COCOA, NETHER_WART]
    plant-materials: [WHEAT_SEEDS, CARROT, POTATO, BEETROOT_SEEDS, SUGAR_CANE, MELON_SEEDS, PUMPKIN_SEEDS, COCOA_BEANS, NETHER_WART]
    count-hoe-farmland: true
  chef:
    enabled: true
    display-name: '&bDaily'
    icon: CLOCK
    base-target: 32
    target-increase-per-level: 20
    cooked-items: [COOKED_BEEF, COOKED_CHICKEN, COOKED_MUTTON, COOKED_PORKCHOP, COOKED_COD, COOKED_SALMON, BAKED_POTATO, DRIED_KELP]
  monster_hunter:
    enabled: true
    display-name: '&cMonster Hunter'
    icon: IRON_SWORD
    base-target: 28
    target-increase-per-level: 14
    entities: [ZOMBIE, SKELETON, SPIDER, CREEPER, ENDERMAN, WITCH, DROWNED, HUSK, STRAY, SLIME, PHANTOM, PILLAGER, VINDICATOR, EVOKER, RAVAGER, BREEZE, BOGGED]
  animal_hunter:
    enabled: true
    display-name: '&fAnimal'
    icon: COOKED_CHICKEN
    base-target: 28
    target-increase-per-level: 13
    entities: [COW, SHEEP, CHICKEN, PIG, RABBIT, COD, SALMON, PUFFERFISH, TROPICAL_FISH]
  fishing:
    enabled: true
    display-name: '&bFishing'
    icon: FISHING_ROD
    base-target: 20
    target-increase-per-level: 12

permissions:
  use: 'veliorasuite.quest.use'
  admin: 'veliorasuite.quest.admin'
  reload: 'veliorasuite.quest.reload'
  bypass-mana: 'veliorasuite.quest.bypassmana'
  reset: 'veliorasuite.quest.reset'

