settings:
  enabled: true
  spawn:
    enabled: true
    interval-minutes: 30
    despawn-minutes: 20
    announce-spawn: true
    announce-death: true
    announce-despawn: true
    allow-multiple-active: false
    require-spawn-point: true
    warning-times-minutes: [5, 1]

rarity-chance:
  common: 50.0
  rare: 25.0
  epic: 15.0
  legendary: 8.0
  mythic: 2.0

bossbar:
  enabled: true
  title: '&c%boss% &7- &f%health%&7/&f%max_health% HP &8| &e%time%'
  color-by-rarity: true
  style: SEGMENTED_20
bossbar-radius: 80

arena:
  enabled: true
  radius: 45
  target-radius: 45
  leash-to-spawn: true
  teleport-back-if-far: true
  teleport-back-distance: 55
  teleport-back-if-below-spawn-y: true
  below-y-offset: 12
  remove-minion-outside-radius: true

targeting:
  enabled: true
  include-survival: true
  include-adventure: true
  include-creative: false
  include-spectator: false
  target-radius-horizontal: 64
  target-radius-vertical: 32
  retarget-interval-seconds: 3
  force-target-nearest: true
  ignore-line-of-sight: true
  target-players-above: true
  target-players-below: true
  no-target-teleport-back: false

debug:
  targeting: false

bosses:
  rotten_colossus:
    entity: HUSK
    display-name: '&2Rotten Colossus'
    rarity: COMMON
    health: 150
    damage: 4.0
    scale: 3.5
    skills: [GROUND_SLAM, SUMMON_MINIONS]
    rewards:
      money: { enabled: true, min: 10000, max: 25000 }
  forest_guardian:
    entity: IRON_GOLEM
    display-name: '&aForest Guardian'
    rarity: RARE
    health: 300
    damage: 6.0
    scale: 3.0
    skills: [SUMMON_MINIONS, POISON_CLOUD, RAGE_MODE]
    rewards:
      money: { enabled: true, min: 25000, max: 50000 }
  infernal_butcher:
    entity: VINDICATOR
    display-name: '&cInfernal Butcher'
    rarity: RARE
    health: 250
    damage: 6.0
    scale: 3.0
    skills: [GROUND_SLAM, SUMMON_MINIONS, RAGE_MODE]
    rewards:
      money: { enabled: true, min: 25000, max: 50000 }
  deep_drowned_king:
    entity: DROWNED
    display-name: '&3Deep Drowned King'
    rarity: RARE
    health: 300
    damage: 6.0
    scale: 3.0
    skills: [PULL_AURA, POISON_CLOUD, RAGE_MODE]
    rewards:
      money: { enabled: true, min: 25000, max: 50000 }
  ancient_warden:
    entity: WARDEN
    display-name: '&9Ancient Warden'
    rarity: EPIC
    health: 500
    damage: 8.0
    scale: 3.5
    skills: [GROUND_SLAM, PULL_AURA, POISON_CLOUD, RAGE_MODE]
    rewards:
      money: { enabled: true, min: 50000, max: 100000 }
  abyss_brute:
    entity: PIGLIN_BRUTE
    display-name: '&5Abyss Brute'
    rarity: EPIC
    health: 400
    damage: 8.0
    scale: 3.5
    skills: [GROUND_SLAM, FIRE_BOMB, PULL_AURA, RAGE_MODE]
    rewards:
      money: { enabled: true, min: 50000, max: 100000 }
  namazu_earthshaker:
    entity: RAVAGER
    display-name: '&6Namazu Earthshaker'
    rarity: LEGENDARY
    health: 500
    damage: 10.0
    scale: 3.0
    skills: [GROUND_SLAM, FIRE_BOMB, SUMMON_MINIONS, RAGE_MODE]
    rewards:
      money: { enabled: true, min: 75000, max: 150000 }
  soul_reaper:
    entity: WITHER_SKELETON
    display-name: '&8Soul Reaper'
    rarity: LEGENDARY
    health: 450
    damage: 9.0
    scale: 3.5
    skills: [PULL_AURA, POISON_CLOUD, SUMMON_MINIONS, RAGE_MODE]
    rewards:
      money: { enabled: true, min: 75000, max: 150000 }

skills:
  enabled: true
  cooldown-seconds: 12
  random-skill: true
  default: [GROUND_SLAM, SUMMON_MINIONS, FIRE_BOMB, PULL_AURA, POISON_CLOUD, RAGE_MODE]
  damage:
    ground-slam: 6.0
    fire-bomb: 8.0
  summon:
    max-minions: 8
    minions-per-cast: 3
    types: [ZOMBIE, HUSK, VINDICATOR, DROWNED]

protection:
  respect-worldguard: false
  respect-redprotect: false
  prevent-block-damage: true
  allow-boss-damage-in-protected-region: true

rewards:
  min-damage-to-reward: 20.0
  min-damage-contribution-percent: 5.0
  reward-cooldown-seconds: 60
  default-money:
    enabled: true
    min: 10000
    max: 150000
  top-damage-bonus:
    enabled: false
    first: { min: 0, max: 0 }
    second: { min: 0, max: 0 }
    third: { min: 0, max: 0 }
  money-total-cap:
    enabled: true
    max-per-player: 150000
  materials:
    common: { diamond: 0, ancient-debris: 0 }
    rare: { diamond: 1, ancient-debris: 0 }
    epic: { diamond: 2, ancient-debris: 0 }
    legendary: { diamond: 3, ancient-debris: 1 }
    mythic: { diamond: 3, ancient-debris: 1 }

effects:
  spawn:
    title-enabled: true
    title: '&c%boss%'
    subtitle: '&7Boss %rarity% muncul di &f%world%'
    sound: ENTITY_WARDEN_ROAR
    particle: SOUL
    particle-count: 120
  death:
    sound: UI_TOAST_CHALLENGE_COMPLETE
    particle: TOTEM_OF_UNDYING

messages:
  prefix: '&8[&cVelioraBoss&8] '
  boss-spawn: '%prefix% &c%boss% &7muncul di &f%world% %x% %y% %z%&7!'
  boss-death: '%prefix% &a%boss% berhasil dikalahkan!'
  boss-despawn: '%prefix% &e%boss% menghilang.'
  boss-next: '%prefix% &eBoss belum muncul. Spawn berikutnya dalam &f%time%&e.'
  boss-active: '%prefix% &cBoss aktif: &f%boss% &7di &f%world% %x% %y% %z%&7. HP: &f%health%/%max_health%'
  spawn-set: '%prefix% &aSpawn boss &f%name% &aberhasil diset.'
  reload-success: '%prefix% &aVelioraBoss berhasil direload.'
  stop-success: '%prefix% &aBoss aktif berhasil dihentikan.'
  no-active-boss: '%prefix% &eTidak ada boss aktif.'
  no-spawn-point: '%prefix% &cBelum ada spawn point boss. Gunakan /boss set <nama>.'
  top-damage-header: '&cTop Damage Boss:'
  reward-received: '%prefix% &aKamu mendapat reward boss karena memberi &f%damage% &adamage.'
  reward-money: '%prefix% &aKamu mendapat reward uang boss: &e%money%'
