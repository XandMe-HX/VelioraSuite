    use-pathfinder: true
  flying-safe-mode:
    enabled: true
  economy:
    enabled: true
    gacha-price: 100000
    direct-buy:
      min-price: 100000
      max-price: 1000000

leveling:
  scale-per-level: 0.003
  max-scale-bonus: 0.15

gacha:
