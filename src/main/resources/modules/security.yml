settings:
  enabled: true
  prefix: '&7[&eVELIORA &aSECURITY&7] &r'
  alerts:
    enabled: true
    cooldown-seconds: 5
    max-recent-alerts: 20
  combat-guard:
    config-version: 2
    enabled: true
    # Floodgate dicek lewat UUID API; prefix nama hanya fallback untuk versi lama.
    # Bedrock/touch diberi toleransi lebih besar dan tidak ditindak dari satu sinyal saja.
    java-max-reach: 3.45
    java-hard-reach-extra: 0.35
    bedrock-max-reach: 4.25
    bedrock-hard-reach-extra: 0.55
    minimum-facing-dot: 0.05
    bedrock-minimum-facing-dot: -0.25
    bedrock-strong-signals-required: 3
    minimum-tps-for-geometry: 18.0
    multi-target-count: 3
    maximum-cps: 22
    minimum-event-score: 8
    score-decay-per-second: 5.5
    stage-1-score: 90
    stage-2-score: 175
    stage-3-score: 275
    max-evidence-per-player: 20
    # Maksimal tiga alert per sesi. Stage 3 hanya kick + case; ban tetap keputusan staff.
    require-human-confirmation-for-ip-ban: true
  join-protection:
    enabled: true
    max-joins-per-ip: 5
    window-seconds: 30
    kick-message: '&cTerlalu banyak join dari koneksi yang sama. Coba lagi nanti.'
  name-protection:
    config-version: 3
    enabled: true
    name-regex: '^[a-zA-Z0-9_]{3,16}$'
    allow-bedrock-prefix: true
    bedrock-prefixes: ['_']
    reserve-bedrock-prefix-for-floodgate: true
    kick-message: '&cNama player tidak valid.'
  identity-protection:
    enabled: true
    same-ip-different-names:
      enabled: true
      window-seconds: 120
      max-unique-names-before-alert: 3
      max-unique-names-before-kick: 5
      temporary-block-seconds: 60
      action-alert: true
      action-kick: true
    same-name-same-ip-rejoin:
      enabled: true
      window-seconds: 120
      max-rejoins-before-alert: 6
      max-rejoins-before-delay: 10
      delay-seconds: 10
      action-alert: true
      action-kick: false
  risk-score:
    enabled: true
    alert-threshold: 40
    kick-threshold: 70
    temporary-block-threshold: 90
    temporary-block-seconds: 60
  ai-detection:
    enabled: false
    provider: 'none'
    endpoint: ''
    timeout-ms: 1500
    advisory-only: true
  spawner-guard:
    enabled: true
    limit-per-player: 1
    consume-blocked-spawner: true
    alert-cooldown-seconds: 10
  xray-enforcement:
    enabled: true
    # 1: blindness/title/sound, 2: quarantine + kick, 3: ban 3 hari,
    # pelanggaran setelah ban: 15 hari. Semua tahap menyimpan bukti.
    strike-cooldown-minutes: 10
    visual-alert-limit: 3
    first-warning-blindness-seconds: 10
    first-ban-days: 3
    repeat-ban-days: 15
    appeal-contact: 'WhatsApp Owner'
    honeypot:
      enabled: true
      # Hanya dikirim ke satu pemain Java yang sudah HIGH dan sedang di bawah tanah.
      lifetime-seconds: 20
      # Satu sentuhan baru dapat menindak jika skor lain juga sangat tinggi; selain itu perlu dua sentuhan.
      hit-plus-high-score: 180
    # Tetap dibaca agar command lama tidak rusak.
    confirmation-expiry-minutes: 60
  anti-dupe:
    enabled: true
    scan-cooldown-ticks: 10
    kick-on-quarantine: true
    # Batas berlaku pada inventory player, bukan chest/base. Item berlebih dikarantina.
    inventory-limits:
      SPAWNER: 8
      DIAMOND: 512
      DIAMOND_BLOCK: 64
      DIAMOND_ORE: 128
      DEEPSLATE_DIAMOND_ORE: 128
      ANCIENT_DEBRIS: 256
      NETHERITE_SCRAP: 256
      NETHERITE_INGOT: 128
      NETHERITE_BLOCK: 16
      EMERALD: 768
      EMERALD_BLOCK: 64
      EMERALD_ORE: 128
      DEEPSLATE_EMERALD_ORE: 128
      RAW_IRON_BLOCK: 64
      RAW_GOLD_BLOCK: 64
      RAW_COPPER_BLOCK: 64
  command-protection:
    enabled: true
    max-command-length: 160
    block-control-characters: true
  tab-protection:
    enabled: true
    hide-blocked-commands: true
permissions:
  admin: 'veliorasuite.security.admin'
  owner: 'veliorasuite.security.owner'
  reload: 'veliorasuite.security.reload'
  alerts: 'veliorasuite.security.alerts'
  bypass: 'veliorasuite.security.bypass'
messages:
  no-permission: '%prefix% &cKamu tidak punya izin.'
  reload-success: '%prefix% &aVelioraSecurity berhasil direload.'
  command-blocked: '%prefix% &cCommand ini tidak diperbolehkan.'
  command-too-long: '%prefix% &cCommand terlalu panjang.'
  command-invalid: '%prefix% &cCommand tidak valid.'
  suspicious-join-kick: '%prefix% &cTerlalu banyak akun berbeda dari koneksi yang sama. Coba lagi sebentar.'
  rejoin-delay-kick: '%prefix% &eKoneksi kamu terlalu sering reconnect. Tunggu sebentar lalu coba masuk lagi.'
  spawner-limit-reached: '%prefix% &cKamu hanya boleh memiliki &f%limit% spawner &csaja. Spawner tambahan dihapus.'
  spawner-limit-alert: '&8[&cVelioraSpawnerGuard&8] &f%player% &cmencoba memasang spawner ke-%attempt% &7(%world% %x% %y% %z%&7). &eDiblokir dan dihapus.'
