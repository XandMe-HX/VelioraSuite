# =========================================================
# VELIORASKILLS CONFIG
# =========================================================
# Fungsi:
# - Pengganti AuraSkills versi VelioraSuite.
# - Exp skill sekarang DISARANKAN dari quest, bukan dari aktivitas random.
# - Quest memberi skill-exp saat selesai, jadi quest terasa berguna.
#
# Command:
# - /skills atau /sk -> lihat skill dan mana
# - /vskills reload -> reload config khusus admin
#
# Placeholder PlaceholderAPI:
# - %veliorasuite_mana%
# - %veliorasuite_max_mana%
# - %veliorasuite_mining_level%
# - %veliorasuite_woodcutting_level%
# - %veliorasuite_fishing_level%
# Bisa dipakai di TAB/belowname: %veliorasuite_mana%/%veliorasuite_max_mana%
# =========================================================

enabled: true

settings:
  base-exp: 100
  exp-per-level: 50

mana:
  enabled: true
  max: 20
  regen-amount: 1
  regen-seconds: 300

actionbar:
  enabled: true
  update-ticks: 40
  format: '&c❤ %health%/%max_health% &8| &a⛃ &f%mana%/%max_mana% &8| &bMining Lv.%mining_level% &8| &eFishing Lv.%fishing_level%'

skills:
  mining:
    enabled: true
    display-name: 'Mining'
  woodcutting:
    enabled: true
    display-name: 'Woodcutting'
  farming:
    enabled: true
    display-name: 'Farming'
  fishing:
    enabled: true
    display-name: 'Fishing'
  combat:
    enabled: true
    display-name: 'Combat'
  chef:
    enabled: true
    display-name: 'Chef'
  hunter:
    enabled: true
    display-name: 'Hunter'

messages:
  level-up: '&8【&aVelioraSkills&8】 &aSkill &f%skill% &anaik ke level &f%level%&a!'
