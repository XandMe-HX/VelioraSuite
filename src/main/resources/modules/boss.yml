  boss-list-header: '%prefix% &eBoss tersedia:'
  boss-list-line: '&7- &f%boss% &8| &e%rarity% &8| &cHP %health% &8| &cDMG %damage%'
  boss-info-header: '%prefix% &eInfo Boss: &f%boss%'
