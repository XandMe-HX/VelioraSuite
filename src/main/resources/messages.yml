# =========================================================
# VELIORASUITE MESSAGES
# =========================================================
# Semua pesan core VelioraSuite ada di sini.
#
# Cara edit:
# - Pakai kode warna Minecraft dengan &.
# - Contoh: &a hijau, &c merah, &e kuning, &f putih.
# - Setelah edit, jalankan /vs reload.
# =========================================================

prefix: '&8[&bVeliora&3Suite&8]'

no-permission: '%prefix% &cKamu tidak punya izin.'
reload-success: '%prefix% &aPlugin berhasil direload.'
unknown-command: '%prefix% &cCommand tidak dikenal. Gunakan &f/vs help&c.'
only-player: '%prefix% &cCommand ini hanya bisa dipakai oleh player.'

help:
  - '&8&m--------------------------------'
  - '&a&lVelioraSuite &7- Core Command'
  - '&e/vs help &7- Melihat bantuan command.'
  - '&e/vs reload &7- Reload config utama.'
  - '&e/vs modules &7- Melihat status module.'
  - '&e/vs version &7- Melihat versi plugin.'
  - '&e/vs debug &7- Melihat status debug.'
  - '&8&m--------------------------------'
