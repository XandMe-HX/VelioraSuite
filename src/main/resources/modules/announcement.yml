# =========================================================
# VELIORAANNOUNCEMENT CONFIG
# =========================================================
# Fungsi:
# - Server otomatis broadcast pesan ke chat setiap beberapa menit.
# - Cocok untuk promosi /vguide, /vrules, /shop, Discord, event, claim.
# Cara kerja:
# - interval-seconds: waktu jeda antar pesan.
# - mode random: pesan dipilih acak.
# - mode sequential: pesan urut dari atas ke bawah.
# Command admin:
# - /vannounce status
# - /vannounce reload
# - /vannounce send <id>
# =========================================================

enabled: true

settings:
  interval-seconds: 300
  mode: random

announcements:
  rules:
    worlds: []
    lines:
      - '&8【&aVeliora&8】 &fJangan lupa baca rules dengan &a/vrules&f.'
  guide:
    worlds: []
    lines:
      - '&8【&aVeliora&8】 &fBingung command? Gunakan &a/vguide&f.'
  claim:
    worlds:
      - world
    lines:
      - '&8【&aVeliora&8】 &fClaim base kamu agar aman dari grief.'
  shop:
    worlds: []
    lines:
      - '&8【&aVeliora&8】 &fButuh jual beli item? Gunakan &a/shop&f atau &a/sellgui&f.'
  report:
    worlds: []
    lines:
      - '&8【&aVeliora&8】 &fMenemukan masalah? Gunakan &a/report &fatau &a/bugreport&f.'

messages:
  no-permission: '&8【&aVelioraAnnouncement&8】 &cKamu tidak punya izin.'
  reload: '&8【&aVelioraAnnouncement&8】 &aConfig announcement berhasil direload.'
