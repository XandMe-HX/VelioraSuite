# =========================================================
# VELIORAQUEST CONFIG
# =========================================================
# Fungsi:
# - Quest berbasis GUI dan command.
# - Player bisa membuka GUI dengan /vquest.
# - Progress otomatis dari break block, kill mob, fishing, cooking, dan crafting.
# - Quest selesai akan memberi money, exp vanilla, dan skill exp VelioraSkills.
#
# Command player:
# - /vquest              -> buka GUI quest
# - /vquest list         -> lihat daftar quest lewat chat
# - /vquest start <id>   -> ambil quest langsung
# - /vquest status       -> lihat quest aktif
# - /vquest abandon      -> batalkan quest
#
# Tipe quest:
# - break = hancurkan block
# - kill  = bunuh mob
# - fish  = mancing
# - cook  = ambil hasil masakan dari furnace/smoker
# - craft = craft item tertentu
# =========================================================

enabled: true

gui:
  title: '&8Veliora Quest'
  size: 54

