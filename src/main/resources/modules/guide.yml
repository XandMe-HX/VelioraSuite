# =========================================================
# VELIORAGUIDE CONFIG
# =========================================================
# Fungsi:
# - Mengirim panduan, rules, dan product server lewat chat.
# - Gunakan font biasa agar mudah dibaca player.
# - Jangan pakai small caps.
#
# Command utama:
# - /vguide           -> buka Panduan Server halaman 1
# - /vguide <page>    -> buka Panduan Server halaman tertentu
# - /vrules           -> buka Rules Server halaman 1
# - /vrules <page>    -> buka Rules Server halaman tertentu
# - /vproduct         -> buka Product/Fitur Server halaman 1
# - /vproduct <page>  -> buka Product/Fitur Server halaman tertentu
# - /vguide reload    -> reload file ini, khusus admin
#
# Aturan update:
# - Jika ada module, command, atau fitur berubah, update guide ini juga.
# - Tujuannya supaya panduan tidak berbeda dengan fitur asli server.
# - Jangan masukkan nama asli owner. Pakai XandMe saja jika butuh contoh nama.
# =========================================================

enabled: true

settings:
  clear-chat-before-page: true
  clear-chat-lines: 8
  show-navigation: true
  clickable-buttons-java: true
  bedrock-navigation-hint: true

messages:
  no-permission: '&8【&aVelioraGuide&8】 &cKamu tidak punya izin.'
  invalid-page: '&8【&aVelioraGuide&8】 &cHalaman tidak valid.'
  page-not-found: '&8【&aVelioraGuide&8】 &cHalaman &f%page% &ctidak ditemukan.'
  reload-success: '&8【&aVelioraGuide&8】 &aGuide berhasil direload.'

