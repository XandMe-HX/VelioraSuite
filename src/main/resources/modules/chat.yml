# ==================================================
# VelioraChat Configuration
# ==================================================
# Module chat format dan proteksi chat ringan.
# ==================================================

settings:
  enabled: true
  prefix: '&7[&eVELIORA &aCHAT&7] &r'

  # VelioraSuite menjadi formatter chat utama. Matikan EssentialsChat/LPC formatter
  # apabila memakai ini, supaya satu pesan tidak terformat dua kali.
  formatter-enabled: true
  # Saat interactive chat aktif, VelioraSuite menjadi satu-satunya formatter
  # agar hover/click tidak hilang atau dikirim dua kali oleh EssentialsChat.
  essentials-mode: false
  use-placeholderapi: true
  team-tag-placeholder-enabled: true
  protection-enabled: true

  # Interactive chat mendukung token profil seperti [item], [pet], dan [quest].
  # Command dalam kurung, misalnya [/spawn] atau [/warp lobby], menjadi tombol
  # yang hanya MENGISI chat penerima. Tidak ada command yang dijalankan otomatis.
  # Saat aktif, VelioraSuite menjadi formatter utama. Matikan EssentialsChat
  # formatter agar pesan tidak ganda atau formatnya tertimpa.
  interactive-chat:
    enabled: true
    own-chat-format: true
    action: SUGGEST_COMMAND
    hover: '&bKlik untuk menulis &f%command%&b ke kolom chat.'
    # [item] menampilkan item tangan dengan hover. [inv]/[inventory] dan
    # [ender]/[enderchest] membagikan isi sendiri lewat hover teks interaktif.
    # [pet], [quest], [fish], [team], dan [warp] memberi profil hover yang
    # hanya bekerja di chat biasa, tidak pernah di command /... .
    # [@Nama] menyarankan /tpa Nama. Share diberi cooldown terpisah agar tidak spam.
    item-sharing-enabled: true
    inventory-sharing-enabled: true
    ender-sharing-enabled: true
    mention-enabled: true
    share-cooldown-seconds: 10
    share-max-items: 36
    # Daftar lama tetap disimpan untuk kompatibilitas konfigurasi. Semua command
    # yang ditulis dalam [kurung] tetap aman karena hanya disarankan, bukan dijalankan.
    allowed-commands:
      - spawn
      - warp
      - rtp
      - home
      - tpa
      - tpaccept
      - tpdeny
      - msg
      - r
      - pay
      - balance
      - shop
      - sell
      - fish
      - pet
      - skills
      - stats
      - vgclaim
      - vguide
      - vrank
      - vproduct
      - kits
      - team
      - teama
      - trader
      - vtrading
      - boss
      - pet
      - vgpetualang
      - vgteam
      - vgwarp
      - homes
      - sethome
      - delhome
      - report
    # Kata di dalam [kurung] hanya aktif jika termasuk trigger bawaan atau
    # ditulis di bawah ini. Ini mencegah teks biasa seperti [wkwk] berubah
    # menjadi tombol yang membingungkan.
    custom-triggers:
      warp_lobby:
        tokens: [lobby, warp lobby]
        command: '/vgwarp lobby'
        label: '&a[WARP LOBBY]'
        hover: '&bKlik untuk menulis &f/vgwarp lobby'
      daftar_pet:
        tokens: [pet list, koleksi pet]
        command: '/pet list'
        label: '&d[KOLEKSI PET]'
        hover: '&bKlik untuk menulis &f/pet list'
      koleksi_ikan:
        tokens: [fish collection, koleksi ikan]
        command: '/fish collection'
        label: '&3[KOLEKSI IKAN]'
        hover: '&bKlik untuk menulis &f/fish collection'
      quest_team:
        tokens: [quest team, vg team]
        command: '/vgteam'
        label: '&b[QUEST TEAM]'
        hover: '&bKlik untuk menulis &f/vgteam'

  cooldown:
    enabled: true
    seconds: 5

  command-spam:
    enabled: true
    seconds: 2
    apply-to-all-commands: true
    ignored-commands:
      - '/login'
      - '/register'
      - '/l'
      - '/reg'
    extra-cooldowns:
      spawn: 5
      home: 5
      tpa: 3
      msg: 1
      r: 1
      pay: 3
      vguide: 2
      vrank: 2
      vproduct: 2
      boss: 3
      kits: 3
      shop: 3
      rtp: 8

  auto-reply:
    # Auto bantuan berbasis kata kunci. Bukan AI API, tapi bot pintar ringan agar member tidak tanya berulang.
    enabled: true
    cooldown-seconds: 20
    delay-ticks: 14
    prefix: '&8[&aVelioraGuide&8] '
    priority-replies: [social, social_activity, owner_help, urgent_help]
    replies:
      social:
        triggers: ['sepi', 'sendirian', 'gabut', 'bosen', 'bosan', 'temenin', 'ngobrol dong', 'ga ada temen', 'gak ada temen', 'sunyi']
        lines:
          - '&fAku temenin kok. Kita mulai santai aja: &b/rtp &7-> cari tempat bagus -> claim -> bangun base kecil.'
          - '&7Kalau lagi sepi, coba target ringan: cari kayu, bikin rumah, naikin pet, atau mancing sambil nunggu player lain online.'
          - '&7Veliora Gardens dibuat buat suasana santai. Kamu gak harus buru-buru jadi kaya, nikmati progresnya pelan-pelan.'
      social_activity:
        triggers: ['mabar', 'main bareng', 'ada yang main', 'ramein dong', 'ajak main', 'siapa online', 'temen main']
        lines:
          - '&fAjak player lain dengan sopan: &7"ada yang mau mabar survival/boss/mancing?"'
          - '&7Sambil nunggu, kamu bisa cek &b/vguide&7, ikut &b/boss status&7, atau mulai base lewat &b/rtp&7.'
      greeting:
        triggers: ['halo', 'hai', 'hello', 'hi', 'pagi', 'siang', 'sore', 'malam', 'assalamualaikum', 'permisi']
        lines:
          - '&fHalo, selamat datang di &bVeliora Gardens&f.'
          - '&7Butuh arah? Ketik &b/vguide&7. Mau mulai survival? Pakai &b/rtp&7 dulu.'
      thanks:
        triggers: ['makasih', 'terima kasih', 'thx', 'thanks', 'ty', 'sip makasih', 'oke makasih']
        lines:
          - '&fSama-sama. Main santai aja, jaga chat tetap sopan, dan nikmati Veliora Gardens.'
      goodbye:
        triggers: ['bye', 'dadah', 'dah offline', 'off dulu', 'keluar dulu', 'logout dulu', 'udahan dulu']
        lines:
          - '&fOke, hati-hati. Jangan lupa simpan barang penting dan set home sebelum offline.'
          - '&7Kalau balik lagi nanti, lanjut dari &b/home base&7 atau cek progres lewat menu server.'
      motivation:
        triggers: ['capek', 'malas', 'bingung banget', 'susah banget', 'gagal terus', 'baru main susah']
        lines:
          - '&fPelan-pelan aja. Di survival, progres kecil tetap progres.'
          - '&7Mulai dari target simpel: cari base, claim, sethome, kumpulin uang, lalu upgrade tools.'
      newbie:
        triggers: ['newbie', 'baru join', 'baru main', 'pemula', 'cara mulai', 'mulai gimana', 'harus ngapain']
        lines:
          - '&fUrutan awal yang aman: &b/register/login &7-> &b/vguide &7-> &b/kits starter &7-> &b/rtp &7-> claim -> &b/sethome base&f.'
          - '&7Jangan bawa semua barang penting saat eksplor. Simpan dulu di chest/base.'
      guide:
        triggers: ['panduan', 'cara main', 'command apa', 'fitur server', 'guide', 'vguide', 'mulai dari mana', 'awal main', 'command awal']
        lines:
          - '&fButuh panduan? Ketik &b/vguide &7untuk menu utama server.'
          - '&7Cek juga &b/vrules&7, &b/vrank&7, &b/vproduct&7, &b/skills&7, dan &b/pet&7.'
      features:
        triggers: ['semua fitur', 'fitur apa aja', 'fitur lengkap', 'daftar fitur', 'server ini ada apa', 'veliora fitur']
        lines:
          - '&fFitur utama: &bGuide, Rank, Quest, Boss, Pet, Gacha, Shop, RTP, Claim, Report, Fishing, Security, dan Chat Protection&f.'
          - '&7Mulai dari &b/vguide&7, lalu cek &b/vproduct&7 untuk detail fitur server.'
      rules:
        triggers: ['rules', 'aturan', 'peraturan', 'boleh apa aja', 'dilarang apa', 'sopan', 'toxic']
        lines:
          - '&fBaca aturan server lewat &b/vrules&f.'
          - '&7Dilarang cheat, grief, toxic berlebihan, spam, exploit bug, alt farming, dan merusak ekonomi server.'
      public_security:
        triggers: ['server public', 'public server', 'server aman', 'keamanan server', 'anti cheat server', 'takut cheater', 'banyak cheater']
        lines:
          - '&fVeliora Gardens punya sistem security untuk bantu menjaga server tetap aman dan nyaman.'
          - '&7Kalau melihat cheat, xray, exploit, atau akun mencurigakan, gunakan &b/report <player> <alasan>&7.'
      owner_help:
        triggers: ['owner', 'admin', 'staff', 'butuh owner', 'hubungi owner', 'private owner', 'pm owner', 'mau ngomong owner']
        lines:
          - '&fKalau masalah biasa, tulis jelas di grup/server chat agar staff bisa bantu.'
          - '&7Kalau masalah pribadi/private, hubungi Owner secara langsung dengan kronologi yang rapi.'
          - '&7Kalau penting dan butuh cepat, boleh telepon Owner sekali saja. Jangan spam karena Owner juga bisa sedang sibuk.'
      urgent_help:
        triggers: ['penting', 'urgent', 'darurat server', 'masalah penting', 'butuh cepat', 'server error parah', 'uang hilang', 'rank belum masuk']
        lines:
          - '&fKalau ini penting, segera hubungi Owner/Staff dengan bukti, nama player, jam kejadian, dan kronologi singkat.'
          - '&7Untuk hal private, langsung ke Owner. Kalau butuh cepat, telepon sekali saja dan jangan spam.'
      admin_report_help:
        triggers: ['cara lapor admin', 'lapor admin', 'admin bantu', 'staff bantu', 'mau lapor staff', 'mau lapor owner', 'server bermasalah']
        lines:
          - '&fUntuk laporan biasa, gunakan &b/report <player|bug> <alasan>&f agar staff bisa cek rapi.'
          - '&7Kalau butuh private, langsung hubungi Owner. Sertakan bukti, jam kejadian, nama player, dan kronologi singkat.'
      rank:
        triggers: ['rank', 'vip', 'harga rank', 'benefit rank', 'beli rank', 'donate', 'donasi', 'diskon rank', 'rank diskon']
        lines:
          - '&fInfo rank ada di &b/vrank&f.'
          - '&7Untuk pembelian resmi, hubungi Owner yang tertera di pengumuman server.'
      payment:
        triggers: ['transfer', 'tf', 'bayar rank', 'nomor owner', 'wa owner', 'whatsapp owner', 'beli vip', 'beli item', 'sudah tf', 'payment']
        lines:
          - '&fPembayaran hanya lewat kontak resmi Owner yang tertera di pengumuman server.'
          - '&7Simpan bukti transfer. Kalau transfer ke pihak yang tidak berkewajiban, itu di luar tanggung jawab server.'
      scam_warning:
        triggers: ['ketipu', 'scam', 'penipuan', 'ngaku admin', 'admin palsu', 'tf ke orang lain']
        lines:
          - '&cHati-hati penipuan. Admin/Owner resmi tidak akan meminta pembayaran di luar kontak resmi.'
          - '&7Kalau sudah terlanjur ada masalah, kumpulkan bukti chat/transfer lalu hubungi Owner secara private.'
      product:
        triggers: ['produk', 'product', 'fitur', 'plugin', 'vproduct', 'vporduct', 'server ada apa', 'apa aja fiturnya']
        lines:
          - '&fDaftar fitur dan produk server ada di &b/vproduct&f.'
          - '&7Kalau typo &b/vporduct&7 juga tetap diarahkan ke product.'
      home:
        triggers: ['sethome', 'cara set home', 'home tidak bisa', 'home pin', 'teleport home', 'cara pulang', 'cara balik base']
        lines:
          - '&fBuat home: &b/sethome <nama>&f. Teleport: &b/home <nama>&f.'
          - '&7Contoh: &b/sethome base &7lalu &b/home base&7.'
      lost:
        triggers: ['tersesat', 'nyasar', 'lupa base', 'base ilang', 'ga tau pulang', 'gak tau pulang', 'hilang arah']
        lines:
          - '&fCoba cek home kamu dengan &b/homes&f atau langsung &b/home base&f kalau sudah pernah sethome.'
          - '&7Kalau benar-benar stuck, gunakan &b/spawn&7 atau lapor staff dengan lokasi terakhir.'
      claim:
        triggers: ['claim', 'claimland', 'claim land', 'cara claim', 'cara claimland', 'cara claim area', 'base aman', 'grief', 'lahan', 'protect base', 'kenapa ga bisa claim']
        lines:
          - '&fUntuk claim area/base, cek panduan di &b/vguide 5&f.'
          - '&7Urutan aman: &b/rtp &7-> cari lokasi -> claim -> &b/sethome base&7.'
      grief:
        triggers: ['base dirusak', 'digrief', 'griefed', 'rumah rusak', 'chest ilang', 'barang hilang', 'dicolong']
        lines:
          - '&cKalau base/barang bermasalah, segera lapor dengan bukti dan koordinat.'
          - '&7Gunakan &b/report bug/player <alasan>&7 atau hubungi staff. Jangan balas merusak base orang lain.'
      report:
        triggers: ['lapor', 'report', 'bug', 'player nakal', 'cheater', 'error', 'stuck', 'ada bug', 'ketemu bug', 'melaporkan player', 'lapor player']
        lines:
          - '&fLaporkan bug/player dengan &b/report <player|bug> <alasan>&f.'
          - '&7Sertakan bukti, waktu kejadian, lokasi, dan nama player agar staff lebih mudah mengecek.'
      altguard:
        triggers: ['akun double', 'akun ganda', 'akun alt', 'alt account', 'akun kedua', 'akun tuyul', 'double akun', 'akun banyak', 'satu ip', '1 ip', 'akun serumah']
        lines:
          - '&cSetiap koneksi/IP dibatasi agar ekonomi server tetap sehat.'
          - '&7Satu IP boleh normal, dua akun akan dipantau, tiga akun ke atas bisa diblokir. Kalau satu rumah main bareng, lapor Owner/Staff dulu.'
      economy_abuse:
        triggers: ['pay alt', 'transfer alt', 'transfer akun kedua', 'memperkaya akun', 'uang dari alt', 'duit dari alt', 'akun utama', 'akun farming']
        lines:
          - '&cDilarang memakai akun tambahan untuk mengambil reward/kit/uang lalu transfer ke akun utama.'
          - '&7Transfer mencurigakan bisa diblokir dan akun terkait bisa direview oleh admin.'
      anticheat:
        triggers: ['cheat', 'cheater', 'xray', 'anti xray', 'antixray', 'orewatch', 'hack', 'hacker', 'killaura', 'kill aura', 'fly hack', 'nuker', 'auto mine', 'baritone', 'reach', 'aimbot']
        lines:
          - '&cCheat, xray, exploit, dan client ilegal dilarang keras di Veliora Gardens.'
          - '&7Sistem security memonitor pola mining dan perilaku mencurigakan. Jika melihat pelanggaran, gunakan &b/report <player> <alasan>&7.'
          - '&7Jika terkena tindakan dan merasa salah, hubungi Owner/Staff dengan kronologi yang jelas.'
      xray_appeal:
        triggers: ['kena xray', 'dituduh xray', 'bukan xray', 'banding xray', 'appeal xray', 'ban xray', 'kebanned xray', 'kena ban xray']
        lines:
          - '&fJika merasa salah terdeteksi, hubungi Owner/Staff untuk review.'
          - '&7Siapkan kronologi mining: world/lokasi, tools/enchant, potion/beacon, rute mining, dan siapa yang ikut.'
          - '&7Jangan memakai akun lain sebelum proses review selesai.'
      bug_exploit:
        triggers: ['dupe', 'duplikasi', 'exploit', 'bug uang', 'bug shop', 'bug harga', 'kesalahan harga', 'bug reward']
        lines:
          - '&cMemanfaatkan bug, dupe, atau kesalahan harga dilarang keras.'
          - '&7Laporkan lewat &b/report bug <alasan>&7. Pelapor bug valid bisa dipertimbangkan mendapat reward.'
      boss:
        triggers: ['boss', 'dungeon', 'boss dimana', 'boss kapan', 'boss hilang', 'boss ga muncul', 'reward boss', 'ikut boss']
        lines:
          - '&fInfo boss aktif dan lokasi: &b/boss status&f.'
          - '&7Reward boss mengikuti damage kontribusi, jadi ikut hit boss biar dapat hadiah.'
      fishing:
        triggers: ['fishing', 'mancing', 'ikan', 'jual ikan', 'fish bag', 'ikan mahal', 'reward ikan', 'cara mancing']
        lines:
          - '&fFitur mancing bisa dipakai untuk santai cari ikan dan koleksi.'
          - '&7Reward ikan sudah dibuat lebih seimbang agar ekonomi server tetap enak dimainkan.'
      gacha:
        triggers: ['gacha', 'key', 'kunci', 'crate', 'buka crate', 'kunci gacha', 'pet gacha']
        lines:
          - '&fBeli physical crate key lewat &b/keyshop&f. Key langsung masuk inventory.'
          - '&7Pegang key lalu klik crate yang sesuai warnanya.'
      pet:
        triggers: ['pet', 'pets', 'cara pet', 'pet kecil', 'pet ga jalan', 'pet tidak jalan', 'pet ride', 'naik pet', 'pet makan', 'pet feed', 'pet gacha', 'pet summon']
        lines:
          - '&fMenu pet: &b/pet&f. Lihat pet kamu: &b/pet list&f. Panggil pet: &b/pet summon <id>&f.'
          - '&7Naik pet: &b/pet ride&7. Kalau pet tidak jalan, coba turun lalu naik lagi atau lapor staff.'
          - '&7Beri makan pet pakai makanan yang sesuai agar level dan ukurannya naik.'
      rtp:
        triggers: ['rtp', 'random teleport', 'cari tempat', 'survival mulai', 'kemana dulu', 'tempat survival']
        lines:
          - '&fCari tempat survival pakai &b/rtp&f, lalu claim dan sethome di base.'
          - '&7Urutan aman: &b/rtp &7-> claim -> &b/sethome base&7.'
      shop:
        triggers: ['shop', 'jual item', 'sell', 'uang', 'cara jual', 'balance', 'duit', 'harga jual', 'harga beli']
        lines:
          - '&fBuka shop pakai &b/shop&f, jual item pakai &b/sell&f atau menu shop.'
          - '&7Cek uang: &b/balance&7. Transfer: &b/pay <nama> <jumlah>&7.'
      money:
        triggers: ['cara kaya', 'cari uang', 'uang cepat', 'duit cepat', 'cara dapet uang', 'uang susah']
        lines:
          - '&fCari uang yang aman: jual item di &b/shop&f, mancing, quest, boss, dan farming.'
          - '&7Jangan pakai bug/dupe/alt farming. Ekonomi server dibuat pelan tapi stabil biar seru dimainkan lama.'
      kit:
        triggers: ['kit', 'starter', 'kit starter', 'ambil kit', 'peralatan awal']
        lines:
          - '&fAmbil kit awal lewat &b/kits starter&f atau buka menu &b/kits&f.'
          - '&7Kit hanya bisa diambil sesuai cooldown/rules server.'
      login:
        triggers: ['login', 'register', 'daftar', 'password', 'blindness', 'buta', 'lupa password', 'reset password']
        lines:
          - '&fDaftar: &b/register <password> <confirm>&f. Login: &b/login <password>&f.'
          - '&7Kalau lupa password, hubungi Owner/Staff untuk reset.'
      death:
        triggers: ['mati', 'death', 'item hilang', 'drop item', 'mati terus', 'habis mati']
        lines:
          - '&fKalau mati, cek lokasi terakhir dan jangan panik. Simpan barang penting di base sebelum eksplor jauh.'
          - '&7Gunakan armor/tools secukupnya, bawa makanan, dan sethome di base biar aman.'
      nether:
        triggers: ['nether', 'portal nether', 'masuk nether', 'ancient debris', 'debris']
        lines:
          - '&fNether lebih berbahaya. Bawa armor, makanan, block cadangan, dan jangan bawa semua barang penting.'
          - '&7Kalau mining debris, tetap main fair. Xray/client ilegal dilarang.'
      mining:
        triggers: ['mining', 'nambang', 'cari diamond', 'diamond dimana', 'ore', 'tambang']
        lines:
          - '&fMining aman: bawa makanan, torch, block, pickaxe cadangan, dan jangan lupa sethome dekat base.'
          - '&7Gunakan cara legit. Sistem security memantau pola mining yang terlalu tidak normal.'
      farm:
        triggers: ['farm', 'farming', 'kebun', 'tanam', 'panen', 'makanan habis']
        lines:
          - '&fBuat farm kecil dulu: gandum, wortel, kentang, atau tebu. Stabil kecil lebih enak daripada buru-buru besar.'
          - '&7Setelah farm aman, kamu bisa jual hasilnya di shop atau pakai buat kebutuhan survival.'
      building:
        triggers: ['bangun rumah', 'build', 'base bagus', 'ide base', 'rumah bagus', 'dekorasi']
        lines:
          - '&fIde base: mulai dari pondasi kecil, tambah storage, farm, jalan setapak, lalu dekorasi lampu/taman.'
          - '&7Jangan lupa claim area sebelum bangun serius biar aman dari gangguan.'
      lag:
        triggers: ['lag', 'patah patah', 'fps drop', 'server lag', 'ngelag', 'hp kentang']
        lines:
          - '&fKalau terasa lag, coba turunkan render distance dan matikan shader berat dulu.'
          - '&7Server dibuat ramah HP kentang, tapi area ramai/mob banyak tetap bisa berat.'

  anti-repeat:
    enabled: true
    max-repeat: 2

  anti-caps:
    enabled: true
    max-caps-percent: 70
    min-length: 8
    action: LOWERCASE

  word-filter:
    enabled: true
    action: REPLACE
    replacement: '***'
    check-normalized: true
    block-separated-letters: true
    reduce-repeated-letters: true
    blocked-words:
      - 'contohbadword'
      - 'anjg'
      - 'ajg'
      - 'bangsat'
      - 'goblok'
      - 'tolol'
      - 'bego'
      - 'idiot'
      - 'bodoh'
      - 'kntl'
      - 'mmk'
      - 'ngntt'
      - 'jancok'
      - 'jancuk'
      - 'kampret'
      - 'fuck'
      - 'fck'
      - 'shit'
      - 'bitch'
      - 'btch'
      - 'bastard'
      - 'asshole'
      - 'dumbass'
    blocked-patterns: []

permissions:
  use: 'veliorasuite.chat.use'
  admin: 'veliorasuite.chat.admin'
  reload: 'veliorasuite.chat.reload'
  bypass-cooldown: 'veliorasuite.chat.bypasscooldown'
  bypass-command-cooldown: 'veliorasuite.chat.bypasscommandcooldown'
  bypass-filter: 'veliorasuite.chat.bypassfilter'

formats:
  # AuraSkills: Power total | Vault: saldo | VelioraSuite: tag team.
  public-chat: '&8[&bLv %auraskills_power%&8] &8[&a⛃ %vault_eco_balance_formatted%&8] &8[&d%veliorasuite_team_tag%&8] %luckperms_prefix%&f%player%&7: &f%message%'
  team-tag-empty: ''
  luckperms-prefix-empty: ''

messages:
  no-permission: '%prefix% &cKamu tidak punya izin.'
  reload-success: '%prefix% &aVelioraChat berhasil direload.'

  help:
    - '&8&m--------------------------------'
    - '&b&lVelioraChat'
    - '&f/vchat status &7- Lihat status formatter, protection, dan auto reply.'
    - '&f/vchat reload &7- Reload config.'
    - ''
    - '&7Chat cooldown: &fsettings.cooldown.seconds'
    - '&7Command cooldown: &fsettings.command-spam.seconds'
    - '&7Auto reply: &fsettings.auto-reply'
    - '&7Word filter: &fsettings.word-filter.blocked-words'
    - '&8&m--------------------------------'

