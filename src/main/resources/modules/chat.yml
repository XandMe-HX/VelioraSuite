# ==================================================
# VelioraChat Configuration
# ==================================================
# Module chat format dan proteksi chat ringan.
# ==================================================

settings:
  enabled: true
  prefix: '&8[&bVelioraChat&8] '

  formatter-enabled: false
  essentials-mode: true
  use-placeholderapi: true
  team-tag-placeholder-enabled: true
  protection-enabled: true

  cooldown:
    enabled: true
    seconds: 2

  command-spam:
    enabled: true
    seconds: 2
    apply-to-all-commands: true
    ignored-commands:
      - '/login'
      - '/register'
      - '/l'
      - '/reg'
    extra-cooldowns:
      spawn: 5
      home: 5
      tpa: 3
      msg: 1
      r: 1
      pay: 3
      quests: 2
      vguide: 2
      vrank: 2
      vproduct: 2
      boss: 3
      kits: 3
      shop: 3
      rtp: 8

  auto-reply:
    # Auto bantuan berbasis kata kunci. Bukan AI API, tapi bot pintar ringan agar member tidak tanya berulang.
    enabled: true
    cooldown-seconds: 35
    delay-ticks: 20
    prefix: '&8[&aVelioraGuide&8] '
    replies:
      guide:
        triggers: ['panduan', 'cara main', 'bingung', 'command apa', 'fitur server', 'guide', 'vguide', 'mulai dari mana']
        lines:
          - '&fButuh panduan? Ketik &b/vguide &7untuk menu utama server.'
          - '&7Cek juga &b/vrules&7, &b/vrank&7, &b/vproduct&7, dan &b/quests&7.'
      rank:
        triggers: ['rank', 'vip', 'harga rank', 'benefit rank', 'beli rank', 'donate', 'donasi']
        lines:
          - '&fInfo rank ada di &b/vrank&f.'
          - '&7Pakai &b/vrank 2&7 sampai &b/vrank 13 &7untuk detail harga dan benefit.'
      product:
        triggers: ['produk', 'product', 'fitur', 'plugin', 'vproduct', 'vporduct', 'server ada apa']
        lines:
          - '&fDaftar fitur dan produk server ada di &b/vproduct&f.'
          - '&7Kalau typo &b/vporduct&7 juga tetap diarahkan ke product.'
      home:
        triggers: ['sethome', 'cara set home', 'home tidak bisa', 'home pin', 'teleport home', 'cara pulang']
        lines:
          - '&fBuat home: &b/sethome <nama>&f. Teleport: &b/home <nama>&f.'
          - '&7Contoh: &b/sethome base &7lalu &b/home base&7.'
      quest:
        triggers: ['quest', 'misi', 'level quest', 'cara quest', 'quest jalan sendiri', 'pilih quest', 'mana quest']
        lines:
          - '&fQuest harus dipilih dulu lewat &b/quests&f atau &b/quests start <category>&f.'
          - '&7Quest memakai Mana dan tidak jalan sendiri kalau belum dipilih.'
      claim:
        triggers: ['claim', 'claim land', 'cara claim', 'base aman', 'grief', 'lahan', 'protect base']
        lines:
          - '&fUntuk claim area/base, cek panduan di &b/vguide 5&f.'
          - '&7Jangan lupa sethome di base setelah claim: &b/sethome base&7.'
      report:
        triggers: ['lapor', 'report', 'bug', 'player nakal', 'cheater', 'error', 'stuck']
        lines:
          - '&fLaporkan bug/player dengan &b/report <player|bug> <alasan>&f.'
          - '&7Staff/OP online akan menerima notifikasi report.'
      boss:
        triggers: ['boss', 'dungeon', 'boss dimana', 'boss kapan', 'boss hilang', 'boss ga muncul']
        lines:
          - '&fInfo boss aktif dan lokasi: &b/boss status&f.'
          - '&7Boss muncul sesuai jadwal dan lokasi dungeon yang sudah diset staff.'
      gacha:
        triggers: ['gacha', 'key', 'kunci', 'crate', 'buka crate', 'kunci gacha']
        lines:
          - '&fInfo gacha/key cek &b/vproduct&f atau tanya staff kalau key belum masuk.'
          - '&7Pegang key lalu klik crate yang sesuai warnanya.'
      rtp:
        triggers: ['rtp', 'random teleport', 'cari tempat', 'survival mulai', 'kemana dulu']
        lines:
          - '&fCari tempat survival pakai &b/rtp&f, lalu claim dan sethome di base.'
          - '&7Urutan aman: &b/rtp &7-> claim -> &b/sethome base&7.'
      shop:
        triggers: ['shop', 'jual item', 'sell', 'uang', 'cara jual', 'balance', 'duit']
        lines:
          - '&fBuka shop pakai &b/shop&f, jual item pakai &b/sell&f atau menu shop.'
          - '&7Cek uang: &b/balance&7. Transfer: &b/pay <nama> <jumlah>&7.'
      kit:
        triggers: ['kit', 'starter', 'kit starter', 'ambil kit', 'peralatan awal']
        lines:
          - '&fAmbil kit awal lewat &b/kits starter&f atau buka menu &b/kits&f.'
          - '&7Kit hanya bisa diambil sesuai cooldown/rules server.'
      login:
        triggers: ['login', 'register', 'daftar', 'password', 'blindness', 'buta']
        lines:
          - '&fDaftar: &b/register <password> <confirm>&f. Login: &b/login <password>&f.'
          - '&7Kalau layar masih gelap setelah login, relog atau lapor staff.'

  anti-repeat:
    enabled: true
    max-repeat: 2

  anti-caps:
    enabled: true
    max-caps-percent: 70
    min-length: 8
    action: LOWERCASE

  word-filter:
    enabled: true
    action: REPLACE
    replacement: '***'
    check-normalized: true
    block-separated-letters: true
    reduce-repeated-letters: true
    blocked-words:
      - 'contohbadword'
      - 'anjing'
      - 'anjg'
      - 'ajg'
      - 'anj'
      - 'bangsat'
      - 'goblok'
      - 'tolol'
      - 'bego'
      - 'idiot'
      - 'bodoh'
      - 'kontol'
      - 'kntl'
      - 'memek'
      - 'mmk'
      - 'ngentot'
      - 'ngntt'
      - 'peler'
      - 'pepek'
      - 'babi'
      - 'taik'
      - 'jancok'
      - 'jancuk'
      - 'kampret'
      - 'fuck'
      - 'fck'
      - 'shit'
      - 'bitch'
      - 'btch'
      - 'bastard'
      - 'asshole'
      - 'dick'
      - 'pussy'
      - 'cunt'
      - 'motherfucker'
      - 'whore'
      - 'slut'
      - 'dumbass'
    blocked-patterns: []

permissions:
  use: 'veliorasuite.chat.use'
  admin: 'veliorasuite.chat.admin'
  reload: 'veliorasuite.chat.reload'
  bypass-cooldown: 'veliorasuite.chat.bypasscooldown'
  bypass-command-cooldown: 'veliorasuite.chat.bypasscommandcooldown'
  bypass-filter: 'veliorasuite.chat.bypassfilter'

formats:
  public-chat: '&7%luckperms_prefix%&f%player%&7: &f%message%'
  team-tag-empty: ''
  luckperms-prefix-empty: ''

messages:
  no-permission: '%prefix% &cKamu tidak punya izin.'
  reload-success: '%prefix% &aVelioraChat berhasil direload.'

  help:
    - '&8&m--------------------------------'
    - '&b&lVelioraChat'
    - '&f/vchat status &7- Lihat status formatter, protection, dan auto reply.'
    - '&f/vchat reload &7- Reload config.'
    - ''
    - '&7Chat cooldown: &fsettings.cooldown.seconds'
    - '&7Command cooldown: &fsettings.command-spam.seconds'
    - '&7Auto reply: &fsettings.auto-reply'
    - '&7Word filter: &fsettings.word-filter.blocked-words'
    - '&8&m--------------------------------'

  status:
    - '&8&m--------------------------------'
    - '&b&lVelioraChat Status'
    - '&7Formatter: &f%formatter%'
    - '&7Essentials Mode: &f%essentials_mode%'
    - '&7Protection: &f%protection%'
    - '&7Chat Cooldown: &f%chat_cooldown% &7(%chat_cooldown_seconds%s)'
    - '&7Command Cooldown: &f%command_cooldown% &7(%command_cooldown_seconds%s)'
    - '&7Auto Reply: &f%auto_reply% &7(%auto_reply_cooldown%s)'
    - '&7Anti Repeat: &f%anti_repeat% &7(max %anti_repeat_max%)'
    - '&7Anti Caps: &f%anti_caps%'
    - '&7Word Filter: &f%word_filter% &7(%word_filter_action%)'
    - '&7PlaceholderAPI: &f%placeholderapi%'
    - '&8&m--------------------------------'

  cooldown: '%prefix% &cTunggu &f%time%s &csebelum chat lagi.'
  command-cooldown: '%prefix% &cTunggu &f%time%s &csebelum memakai command lagi.'
  repeat-blocked: '%prefix% &cJangan mengirim pesan yang sama berulang kali.'
  caps-fixed: '%prefix% &7Pesan caps kamu dirapikan otomatis.'
  caps-blocked: '%prefix% &cPesan caps tidak diperbolehkan.'
  word-blocked: '%prefix% &cPesan mengandung kata yang tidak diperbolehkan.'
