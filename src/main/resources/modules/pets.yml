settings:
  enabled: true
  max-level: 50
  duplicate-exp: 50
  auto-summon-new-pet: false
  auto-summon-last-pet: false
  death-cooldown-minutes: 15
  stable-safe-mode: true
  walking-pets-only: true
  allow-aquatic-pets: false
  allow-axolotl-ground-pet: true
  allow-flying-pets: false
  follow:
    use-pathfinder: true
  flying-safe-mode:
    enabled: true
  economy:
    enabled: true
    gacha-price: 25000
    direct-buy:
      min-price: 25000
      max-price: 250000

riding:
  enabled: true
  require-adult: true
  default-adult-level: 10
  allow-ride-active-only: true
  dismount-on-dismiss: true
  speed: 0.32
  jump-y: 0.42
  prevent-ride-in-combat: false
  rideable-rarities:
    common: true
    rare: true
    epic: true
    legendary: true
    mythic: true

sounds:
  quiet-pets: true
  silent-pets: true
  play-custom-summon-sound: true
  summon-sound: ENTITY_EXPERIENCE_ORB_PICKUP
  feed-sound: ENTITY_GENERIC_EAT
  volume: 0.25
  pitch: 1.2

leveling:
  scale-per-level: 0.003
  max-scale-bonus: 0.15

gacha:
  chance:
    common: 55.0
    rare: 25.0
    epic: 12.0
    legendary: 6.0
    mythic: 2.0

storage:
  allow-storage-without-active: true
  size:
    common: 27
    rare: 27
    epic: 27
    legendary: 27
    mythic: 27

combat:
  enabled: true
  attack-range: 3.0
  attack-cooldown-seconds: 2
  allow-attack-passive: false
  allow-attack-players: false
  pet-damage-multiplier: 1.0

cosmetic:
  aura-enabled: true
  aura-interval-seconds: 5
  glow-enabled: false
  particles-low-lag: true
  aura-particle: HAPPY_VILLAGER

