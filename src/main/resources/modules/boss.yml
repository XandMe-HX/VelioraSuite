settings:
  enabled: true
  spawn:
    enabled: true
    interval-minutes: 30
    despawn-minutes: 20
    announce-spawn: true
    announce-death: true
    announce-despawn: true
    allow-multiple-active: false
    require-spawn-point: true
    warning-times-minutes:
      - 5
      - 1

rarity-chance:
  common: 50.0
  rare: 25.0
  epic: 15.0
  legendary: 8.0
  mythic: 2.0

bossbar:
  enabled: true
  title: '&c%boss% &7- &f%health%&7/&f%max_health% HP &8| &e%time%'
  color-by-rarity: true
  style: SEGMENTED_20
bossbar-radius: 80

arena:
  enabled: true
  radius: 45
  target-radius: 45
  leash-to-spawn: true
  teleport-back-if-far: true
  teleport-back-distance: 55
  teleport-back-if-below-spawn-y: true
  below-y-offset: 12
  remove-minion-outside-radius: true

bosses:
  ancient_warden:
    entity: WARDEN
    display-name: '&9Ancient Warden'
    rarity: EPIC
    health: 500
    damage: 8.0
    scale: 3.5
    skills:
      - GROUND_SLAM
      - PULL_AURA
      - POISON_CLOUD
      - RAGE_MODE
    rewards:
      money:
        enabled: true
        min: 10000
        max: 30000
  namazu_earthshaker:
    entity: RAVAGER
    display-name: '&6Namazu Earthshaker'
    rarity: LEGENDARY
    health: 500
    damage: 10.0
    scale: 3.0
    skills:
      - GROUND_SLAM
      - FIRE_BOMB
      - SUMMON_MINIONS
      - RAGE_MODE
    rewards:
      money:
        enabled: true
        min: 12000
        max: 30000
  forest_guardian:
    entity: IRON_GOLEM
    display-name: '&aForest Guardian'
    rarity: RARE
    health: 300
    damage: 6.0
    scale: 3.0
    skills:
      - SUMMON_MINIONS
      - POISON_CLOUD
      - RAGE_MODE
    rewards:
      money:
        enabled: true
        min: 3000
        max: 12000
  abyss_brute:
    entity: PIGLIN_BRUTE
    display-name: '&5Abyss Brute'
    rarity: EPIC
    health: 400
    damage: 8.0
    scale: 3.5
    skills:
      - GROUND_SLAM
      - FIRE_BOMB
      - PULL_AURA
      - RAGE_MODE
    rewards:
      money:
        enabled: true
        min: 8000
        max: 25000
  infernal_butcher:
    entity: VINDICATOR
    display-name: '&cInfernal Butcher'
    rarity: RARE
    health: 250
    damage: 6.0
    scale: 3.0
    skills:
      - GROUND_SLAM
      - SUMMON_MINIONS
      - RAGE_MODE
    rewards:
      money:
        enabled: true
        min: 3000
        max: 10000
  soul_reaper:
    entity: WITHER_SKELETON
    display-name: '&8Soul Reaper'
    rarity: LEGENDARY
    health: 450
    damage: 9.0
    scale: 3.5
    skills:
      - PULL_AURA
      - POISON_CLOUD
      - SUMMON_MINIONS
      - RAGE_MODE
    rewards:
      money:
        enabled: true
        min: 12000
        max: 30000
  rotten_colossus:
    entity: HUSK
    display-name: '&2Rotten Colossus'
    rarity: COMMON
    health: 150
    damage: 4.0
    scale: 3.5
    skills:
      - GROUND_SLAM
      - SUMMON_MINIONS
    rewards:
      money:
        enabled: true
        min: 1000
        max: 5000
  deep_drowned_king:
    entity: DROWNED
    display-name: '&3Deep Drowned King'
    rarity: RARE
    health: 300
    damage: 6.0
    scale: 3.0
    skills:
      - PULL_AURA
      - POISON_CLOUD
      - RAGE_MODE
    rewards:
      money:
        enabled: true
        min: 3000
        max: 12000

skills:
  enabled: true
  cooldown-seconds: 12
  random-skill: true
  default:
    - GROUND_SLAM
    - SUMMON_MINIONS
    - FIRE_BOMB
    - PULL_AURA
    - POISON_CLOUD
    - RAGE_MODE
  damage:
    ground-slam: 6.0
    fire-bomb: 8.0
  summon:
    max-minions: 8
    minions-per-cast: 3
    types:
      - ZOMBIE
      - HUSK
      - VINDICATOR
      - DROWNED

protection:
  respect-worldguard: false
  respect-redprotect: false
  prevent-block-damage: true
  allow-boss-damage-in-protected-region: true

rewards:
  # Player harus memberi minimal damage ini agar dapat reward.
  min-damage-to-reward: 20.0

  # Uang utama untuk semua player yang memenuhi minimal damage.
  # Bisa dioverride per boss di bosses.<boss-id>.rewards.money.
  default-money:
    enabled: true
    min: 1000
    max: 30000

  # Bonus uang tambahan untuk top damage 1/2/3.
  # Bonus ini ditambahkan di atas reward uang utama, lalu dicap oleh money-total-cap.
  top-damage-bonus:
    enabled: true
    first:
      min: 5000
      max: 30000
    second:
      min: 3000
      max: 15000
    third:
      min: 1000
      max: 8000

  money-total-cap:
    enabled: true
    max-per-player: 30000

  # Item rare tetap kecil agar economy tidak inflasi.
  materials:
    common:
      diamond: 0
      ancient-debris: 0
    rare:
      diamond: 2
      ancient-debris: 0
    epic:
      diamond: 5
      ancient-debris: 1
    legendary:
      diamond: 10
      ancient-debris: 3
    mythic:
      diamond: 10
      ancient-debris: 5

effects:
  spawn:
    title-enabled: true
    title: '&c%boss%'
    subtitle: '&7Boss %rarity% muncul di &f%world%'
    sound: ENTITY_WARDEN_ROAR
    particle: SOUL
    particle-count: 120
  death:
    sound: UI_TOAST_CHALLENGE_COMPLETE
    particle: TOTEM_OF_UNDYING

messages:
  prefix: '&8[&cVelioraBoss&8] '
  boss-spawn: '%prefix% &c%boss% &7muncul di &f%world% %x% %y% %z%&7!'
  boss-death: '%prefix% &a%boss% berhasil dikalahkan!'
  boss-despawn: '%prefix% &e%boss% menghilang.'
  boss-next: '%prefix% &eBoss belum muncul. Spawn berikutnya dalam &f%time%&e.'
  boss-active: '%prefix% &cBoss aktif: &f%boss% &7di &f%world% %x% %y% %z%&7. HP: &f%health%/%max_health%'
  spawn-set: '%prefix% &aSpawn boss &f%name% &aberhasil diset.'
  reload-success: '%prefix% &aVelioraBoss berhasil direload.'
  stop-success: '%prefix% &aBoss aktif berhasil dihentikan.'
