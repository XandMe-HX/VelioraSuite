# ==================================================
# VelioraChat Configuration
# ==================================================
# Module chat format dan proteksi chat ringan.
# ==================================================

settings:
  enabled: true
  prefix: '&8[&bVelioraChat&8] '

  formatter-enabled: false
  essentials-mode: true
  use-placeholderapi: true
  team-tag-placeholder-enabled: true
  protection-enabled: true

  cooldown:
    enabled: true
    seconds: 2

  command-spam:
    enabled: true
    seconds: 2
    apply-to-all-commands: true
    ignored-commands:
      - '/login'
      - '/register'
      - '/l'
      - '/reg'
    extra-cooldowns:
      spawn: 5
      home: 5
      tpa: 3
      msg: 1
      r: 1
      pay: 3
      quests: 2
      vguide: 2
      vrank: 2
      vproduct: 2
      boss: 3
      kits: 3
      shop: 3
      rtp: 8

  auto-reply:
    # Auto bantuan berbasis kata kunci. Bukan AI API, tapi bot pintar ringan agar member tidak tanya berulang.
    enabled: true
    cooldown-seconds: 0
    delay-ticks: 16
    prefix: '&8[&aVelioraGuide&8] '
    priority-replies: [social, owner_help, urgent_help]
    replies:
      social:
        triggers: ['sepi', 'sendirian', 'gabut', 'bosen', 'bosan', 'temenin', 'ada yang main', 'mabar', 'main bareng', 'ramein dong', 'ngobrol dong']
        lines:
          - '&fAku temenin kok. Coba mulai dari hal kecil dulu: &b/rtp &7-> cari tempat enak -> claim -> bangun base.'
          - '&7Kalau mau mabar, ajak player lain baik-baik di chat. Veliora Gardens dibuat biar suasananya santai dan asik.'
          - '&7Biar gak gabut, coba target hari ini: kumpulin uang, naikin pet, atau ikut boss kalau sudah siap.'
      greeting:
        triggers: ['halo', 'hai', 'hello', 'hi', 'pagi', 'siang', 'sore', 'malam', 'assalamualaikum', 'p']
        lines:
          - '&fHalo, selamat datang di &bVeliora Gardens&f.'
          - '&7Butuh arah? Ketik &b/vguide&7. Mau mulai survival? Pakai &b/rtp&7 dulu.'
      thanks:
        triggers: ['makasih', 'terima kasih', 'thx', 'thanks', 'ty', 'sip makasih', 'oke makasih']
        lines:
          - '&fSama-sama. Main santai aja, jaga chat tetap sopan, dan nikmati Veliora Gardens.'
      owner_help:
        triggers: ['owner', 'admin', 'staff', 'butuh owner', 'hubungi owner', 'private owner', 'pm owner', 'mau ngomong owner']
        lines:
          - '&fKalau masalah biasa, tulis jelas di grup/server chat agar staff bisa bantu.'
          - '&7Kalau masalah pribadi/private, hubungi Owner secara langsung dengan kronologi yang rapi.'
          - '&7Kalau penting dan butuh cepat, boleh telepon Owner sekali saja. Jangan spam karena Owner juga bisa sedang sibuk.'
      urgent_help:
        triggers: ['penting', 'urgent', 'darurat server', 'masalah penting', 'butuh cepat', 'server error parah', 'uang hilang', 'rank belum masuk']
        lines:
          - '&fKalau ini penting, segera hubungi Owner/Staff dengan bukti, nama player, jam kejadian, dan kronologi singkat.'
          - '&7Untuk hal private, langsung ke Owner. Kalau butuh cepat, telepon sekali saja dan jangan spam.'
      guide:
        triggers: ['panduan', 'cara main', 'bingung', 'command apa', 'fitur server', 'guide', 'vguide', 'mulai dari mana', 'awal main', 'command awal']
        lines:
          - '&fButuh panduan? Ketik &b/vguide &7untuk menu utama server.'
          - '&7Cek juga &b/vrules&7, &b/vrank&7, &b/vproduct&7, &b/quests&7, dan &b/pet&7.'
      features:
        triggers: ['semua fitur', 'fitur apa aja', 'fitur lengkap', 'daftar fitur', 'server ini ada apa', 'veliora fitur']
        lines:
          - '&fFitur utama: &bGuide, Rank, Quest, Boss, Pet, Gacha, Shop, RTP, Claim, Report, dan Chat Protection&f.'
          - '&7Mulai dari &b/vguide&7, lalu cek &b/vproduct&7 untuk detail fitur server.'
      rules:
        triggers: ['rules', 'aturan', 'peraturan', 'boleh apa aja', 'dilarang apa', 'sopan', 'toxic']
        lines:
          - '&fBaca aturan server lewat &b/vrules&f.'
          - '&7Dilarang cheat, grief, toxic berlebihan, spam, exploit bug, dan merusak ekonomi server.'
      rank:
        triggers: ['rank', 'vip', 'harga rank', 'benefit rank', 'beli rank', 'donate', 'donasi', 'diskon rank', 'rank diskon']
        lines:
          - '&fInfo rank ada di &b/vrank&f.'
          - '&7Untuk pembelian resmi, hubungi Owner yang tertera di pengumuman server.'
      product:
        triggers: ['produk', 'product', 'fitur', 'plugin', 'vproduct', 'vporduct', 'server ada apa', 'apa aja fiturnya']
        lines:
          - '&fDaftar fitur dan produk server ada di &b/vproduct&f.'
          - '&7Kalau typo &b/vporduct&7 juga tetap diarahkan ke product.'
      home:
        triggers: ['sethome', 'cara set home', 'home tidak bisa', 'home pin', 'teleport home', 'cara pulang', 'cara balik base']
        lines:
          - '&fBuat home: &b/sethome <nama>&f. Teleport: &b/home <nama>&f.'
          - '&7Contoh: &b/sethome base &7lalu &b/home base&7.'
      quest:
        triggers: ['quest', 'misi', 'level quest', 'cara quest', 'quest jalan sendiri', 'pilih quest', 'mana quest', 'quest ga jalan']
        lines:
          - '&fQuest harus dipilih dulu lewat &b/quests&f atau &b/quests start <category>&f.'
          - '&7Quest memakai Mana dan tidak jalan sendiri kalau belum dipilih.'
      claim:
        triggers: ['claim', 'claimland', 'claim land', 'cara claim', 'cara claimland', 'cara claim area', 'base aman', 'grief', 'lahan', 'protect base', 'kenapa ga bisa claim']
        lines:
          - '&fUntuk claim area/base, cek panduan di &b/vguide 5&f.'
          - '&7Urutan aman: &b/rtp &7-> cari lokasi -> claim -> &b/sethome base&7.'
      report:
        triggers: ['lapor', 'report', 'bug', 'player nakal', 'cheater', 'error', 'stuck', 'ada bug', 'ketemu bug', 'melaporkan player', 'lapor player']
        lines:
          - '&fLaporkan bug/player dengan &b/report <player|bug> <alasan>&f.'
          - '&7Sertakan bukti, waktu kejadian, dan lokasi agar staff lebih mudah mengecek.'
      anticheat:
        triggers: ['cheat', 'cheater', 'xray', 'anti xray', 'antixray', 'orewatch', 'hack', 'hacker', 'killaura', 'kill aura', 'fly hack', 'nuker', 'auto mine', 'baritone', 'reach', 'aimbot']
        lines:
          - '&cCheat, xray, exploit, dan client ilegal dilarang keras di Veliora Gardens.'
          - '&7Sistem security memonitor pola mining dan perilaku mencurigakan. Jika melihat pelanggaran, gunakan &b/report <player> <alasan>&7.'
          - '&7Jika terkena tindakan dan merasa salah, hubungi Owner/Staff dengan kronologi yang jelas.'
      xray_appeal:
        triggers: ['kena xray', 'dituduh xray', 'bukan xray', 'banding xray', 'appeal xray', 'ban xray', 'kebanned xray', 'kena ban xray']
        lines:
          - '&fJika merasa salah terdeteksi, hubungi Owner/Staff untuk review.'
          - '&7Siapkan kronologi mining: world/lokasi, tools/enchant, potion/beacon, rute mining, dan siapa yang ikut.'
          - '&7Jangan memakai akun lain sebelum proses review selesai.'
      bug_exploit:
        triggers: ['dupe', 'duplikasi', 'exploit', 'bug uang', 'bug shop', 'bug harga', 'kesalahan harga', 'bug reward']
        lines:
          - '&cMemanfaatkan bug, dupe, atau kesalahan harga dilarang keras.'
          - '&7Laporkan lewat &b/report bug <alasan>&7. Pelapor bug valid bisa dipertimbangkan mendapat reward.'
      payment:
        triggers: ['transfer', 'tf', 'bayar rank', 'nomor owner', 'wa owner', 'whatsapp owner', 'beli vip', 'beli item']
        lines:
          - '&fPembayaran hanya lewat kontak resmi Owner yang tertera di pengumuman server.'
          - '&7Transfer ke pihak yang tidak berkewajiban tidak menjadi tanggung jawab server.'
      boss:
        triggers: ['boss', 'dungeon', 'boss dimana', 'boss kapan', 'boss hilang', 'boss ga muncul', 'reward boss']
        lines:
          - '&fInfo boss aktif dan lokasi: &b/boss status&f.'
          - '&7Reward boss mengikuti damage kontribusi, jadi ikut hit boss biar dapat hadiah.'
      fishing:
        triggers: ['fishing', 'mancing', 'ikan', 'jual ikan', 'fish bag', 'ikan mahal', 'reward ikan']
        lines:
          - '&fFitur mancing bisa dipakai untuk santai cari ikan dan koleksi.'
          - '&7Reward ikan sudah dibuat lebih seimbang agar ekonomi server tetap enak dimainkan.'
      gacha:
        triggers: ['gacha', 'key', 'kunci', 'crate', 'buka crate', 'kunci gacha', 'pet gacha']
        lines:
          - '&fInfo gacha/key cek &b/vproduct&f atau tanya staff kalau key belum masuk.'
          - '&7Pegang key lalu klik crate yang sesuai warnanya.'
      pet:
        triggers: ['pet', 'pets', 'cara pet', 'pet kecil', 'pet ga jalan', 'pet tidak jalan', 'pet ride', 'naik pet', 'pet makan', 'pet feed', 'pet gacha', 'pet summon']
        lines:
          - '&fMenu pet: &b/pet&f. Lihat pet kamu: &b/pet list&f. Panggil pet: &b/pet summon <id>&f.'
          - '&7Naik pet: &b/pet ride&7. Kalau pet tidak jalan, coba turun lalu naik lagi atau lapor staff.'
          - '&7Beri makan pet pakai makanan yang sesuai agar level dan ukurannya naik.'
      rtp:
        triggers: ['rtp', 'random teleport', 'cari tempat', 'survival mulai', 'kemana dulu', 'tempat survival']
        lines:
          - '&fCari tempat survival pakai &b/rtp&f, lalu claim dan sethome di base.'
          - '&7Urutan aman: &b/rtp &7-> claim -> &b/sethome base&7.'
      shop:
        triggers: ['shop', 'jual item', 'sell', 'uang', 'cara jual', 'balance', 'duit', 'harga jual', 'harga beli']
        lines:
          - '&fBuka shop pakai &b/shop&f, jual item pakai &b/sell&f atau menu shop.'
          - '&7Cek uang: &b/balance&7. Transfer: &b/pay <nama> <jumlah>&7.'
      kit:
        triggers: ['kit', 'starter', 'kit starter', 'ambil kit', 'peralatan awal']
        lines:
          - '&fAmbil kit awal lewat &b/kits starter&f atau buka menu &b/kits&f.'
          - '&7Kit hanya bisa diambil sesuai cooldown/rules server.'
      login:
        triggers: ['login', 'register', 'daftar', 'password', 'blindness', 'buta', 'lupa password', 'reset password']
        lines:
          - '&fDaftar: &b/register <password> <confirm>&f. Login: &b/login <password>&f.'
          - '&7Kalau lupa password, hubungi Owner/Staff untuk reset.'
      lag:
        triggers: ['lag', 'patah patah', 'fps drop', 'server lag', 'ngelag', 'hp kentang']
        lines:
          - '&fKalau terasa lag, coba turunkan render distance dan matikan shader berat dulu.'
          - '&7Server dibuat ramah HP kentang, tapi area ramai/mob banyak tetap bisa berat.'

  anti-repeat:
    enabled: true
    max-repeat: 2

  anti-caps:
    enabled: true
    max-caps-percent: 70
    min-length: 8
    action: LOWERCASE

  word-filter:
    enabled: true
    action: REPLACE
    replacement: '***'
    check-normalized: true
    block-separated-letters: true
    reduce-repeated-letters: true
    blocked-words:
      - 'contohbadword'
      - 'anjg'
      - 'ajg'
      - 'bangsat'
      - 'goblok'
      - 'tolol'
      - 'bego'
      - 'idiot'
      - 'bodoh'
      - 'kntl'
      - 'mmk'
      - 'ngntt'
      - 'jancok'
      - 'jancuk'
      - 'kampret'
      - 'fuck'
      - 'fck'
      - 'shit'
      - 'bitch'
      - 'btch'
      - 'bastard'
      - 'asshole'
      - 'dumbass'
    blocked-patterns: []

permissions:
  use: 'veliorasuite.chat.use'
  admin: 'veliorasuite.chat.admin'
  reload: 'veliorasuite.chat.reload'
  bypass-cooldown: 'veliorasuite.chat.bypasscooldown'
  bypass-command-cooldown: 'veliorasuite.chat.bypasscommandcooldown'
  bypass-filter: 'veliorasuite.chat.bypassfilter'

formats:
  public-chat: '&7%luckperms_prefix%&f%player%&7: &f%message%'
  team-tag-empty: ''
  luckperms-prefix-empty: ''

messages:
  no-permission: '%prefix% &cKamu tidak punya izin.'
  reload-success: '%prefix% &aVelioraChat berhasil direload.'

  help:
    - '&8&m--------------------------------'
    - '&b&lVelioraChat'
    - '&f/vchat status &7- Lihat status formatter, protection, dan auto reply.'
    - '&f/vchat reload &7- Reload config.'
    - ''
    - '&7Chat cooldown: &fsettings.cooldown.seconds'
    - '&7Command cooldown: &fsettings.command-spam.seconds'
    - '&7Auto reply: &fsettings.auto-reply'
    - '&7Word filter: &fsettings.word-filter.blocked-words'
    - '&8&m--------------------------------'

  status:
    - '&8&m--------------------------------'
    - '&b&lVelioraChat Status'
    - '&7Formatter: &f%formatter%'
    - '&7Essentials Mode: &f%essentials_mode%'
    - '&7Protection: &f%protection%'
    - '&7Chat Cooldown: &f%chat_cooldown% &7(%chat_cooldown_seconds%s)'
    - '&7Command Cooldown: &f%command_cooldown% &7(%command_cooldown_seconds%s)'
    - '&7Auto Reply: &f%auto_reply% &7(%auto_reply_cooldown%s)'
    - '&7Anti Repeat: &f%anti_repeat% &7(max %anti_repeat_max%)'
    - '&7Anti Caps: &f%anti_caps%'
    - '&7Word Filter: &f%word_filter% &7(%word_filter_action%)'
    - '&7PlaceholderAPI: &f%placeholderapi%'
    - '&8&m--------------------------------'

  cooldown: '%prefix% &cTunggu &f%time%s &csebelum chat lagi.'
  command-cooldown: '%prefix% &cTunggu &f%time%s &csebelum memakai command lagi.'
  repeat-blocked: '%prefix% &cJangan mengirim pesan yang sama berulang kali.'
  caps-fixed: '%prefix% &7Pesan caps kamu dirapikan otomatis.'
  caps-blocked: '%prefix% &cPesan caps tidak diperbolehkan.'
  word-blocked: '%prefix% &cPesan mengandung kata yang tidak diperbolehkan.'
