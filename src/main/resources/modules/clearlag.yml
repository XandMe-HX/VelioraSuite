# =========================================================
# VELIORACLEALAG CONFIG
# =========================================================
# Fungsi:
# - Membersihkan item/entity yang tidak penting supaya TPS server stabil.
# - Menghitung JUMLAH item stack, bukan cuma jumlah entity item.
# - Bisa membatasi mob yang terlalu menumpuk dalam radius tertentu.
#
# Command admin:
# - /vclearlag status
# - /vclearlag clear
# - /vclearlag reload
# =========================================================

enabled: true

auto-clear:
  enabled: true
  interval-seconds: 600
  minimum-item-age-seconds: 300

warning:
  enabled: true
  times: [60, 10]

remove:
  dropped-items: true
  experience-orbs: true
  arrows: true
  snowballs: true
  eggs: true
  fireballs: true
  other-projectiles: false

protect:
  armor-stands: true
  villagers: true
  named-entities: true
  tamed-animals: true
  vehicles-with-passenger: true

mob-limiter:
  enabled: true
  radius: 8.0
  max-same-mob-in-radius: 8
  minimum-age-seconds: 60
  player-safe-radius: 24.0
  remove-unreachable: true
  protected-types:
    - VILLAGER
    - WANDERING_TRADER
    - IRON_GOLEM

worlds:
  enabled-worlds: []
  disabled-worlds:
    - boss_arena
    - event_world

whitelist-items:
  - DIAMOND
  - EMERALD
  - NETHERITE_INGOT
  - NETHERITE_SCRAP
  - ENCHANTED_BOOK
  - TRIDENT
  - ELYTRA
  - SHULKER_BOX
  - DRAGON_EGG

messages:
  no-permission: '&8【&aVelioraClearLag&8】 &cKamu tidak punya izin.'
  warning: '&8【&aVelioraClearLag&8】 &eItem di tanah akan dibersihkan dalam &f%time% &edetik.'
  cleared: '&8【&aVelioraClearLag&8】 &aMembersihkan &f%amount% &aitem/mob dari &f%entities% &aentity.'
  no-items: '&8【&aVelioraClearLag&8】 &7Tidak ada item yang perlu dibersihkan.'
  manual-clear: '&8【&aVelioraClearLag&8】 &aAdmin &f%player% &amembersihkan &f%amount% &aitem/mob dari &f%entities% &aentity.'
  reload: '&8【&aVelioraClearLag&8】 &aConfig berhasil direload.'
