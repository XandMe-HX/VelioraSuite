# =========================================================
# VELIORAGUIDE CONFIG
# =========================================================
# Fungsi:
# - Mengirim panduan, rules, rank, dan product server lewat chat.
# - Gunakan font biasa agar mudah dibaca player.
# - Jangan pakai small caps.
# - Semua warna, layout, footer, dan isi page bisa diedit di sini.
# =========================================================

enabled: true

settings:
  clear-chat-before-page: false
  clear-chat-lines: 0
  show-navigation: true
  clickable-buttons-java: true
  bedrock-navigation-hint: true

  colors:
    separator: '&8&m--------------------------------'
    title: '&6&l'
    subtitle: '&e'
    command: '&b'
    text: '&f'
    description: '&7'
    success: '&a'
    error: '&c'
    bracket: '&8'

  layout:
    blank-line-before-page: true
    blank-line-after-navigation: true
    show-top-separator: true
    show-bottom-separator: true

  footer:
    back-active: '&e[Back]'
    back-disabled: '&7[Back]'
    next-active: '&a[Next]'
    next-disabled: '&7[Next]'
    page-format: '&7Page &f%page%&7/&f%max_page%'
    bedrock-help: '&7Java: klik tombol. Bedrock: &f/%command% <halaman>'

messages:
  no-permission: '&8[&6VelioraGuide&8] &cKamu tidak punya izin.'
  invalid-page: '&8[&6VelioraGuide&8] &cHalaman tidak valid.'
  page-not-found: '&8[&6VelioraGuide&8] &cHalaman &f%page% &ctidak ditemukan.'
