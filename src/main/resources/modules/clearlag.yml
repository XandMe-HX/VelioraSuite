# =========================================================
# VELIORACLEALAG CONFIG
# =========================================================
# Fungsi:
# - Membersihkan item/entity yang tidak penting supaya TPS server lebih stabil.
# - Aman: tidak menghapus player, villager, armor stand, entity bernama, pet jinak, dan item whitelist.
#
# Cara pakai admin:
# - /vclearlag status  -> melihat timer clear berikutnya
# - /vclearlag clear   -> clear manual tanpa menunggu timer
# - /vclearlag reload  -> reload file ini setelah diedit
#
# Cara edit:
# - interval-seconds: jarak auto clear dalam detik. 600 = 10 menit.
# - minimum-item-age-seconds: item baru jatuh tidak akan dihapus sebelum umur ini.
# - warning.times: detik sebelum clear untuk kirim peringatan.
# - whitelist-items: material yang tidak boleh dihapus. Pakai nama material Minecraft/Paper.
# =========================================================

enabled: true

auto-clear:
  enabled: true
  interval-seconds: 600
  minimum-item-age-seconds: 300

warning:
  enabled: true
  times: [60, 10]

remove:
  dropped-items: true
  experience-orbs: true
  arrows: true
  snowballs: true
  eggs: true
  fireballs: true
  other-projectiles: false

protect:
  armor-stands: true
  villagers: true
  named-entities: true
  tamed-animals: true
  vehicles-with-passenger: true

worlds:
  enabled-worlds: []
  disabled-worlds:
    - boss_arena
    - event_world

whitelist-items:
  - DIAMOND
  - EMERALD
  - NETHERITE_INGOT
  - NETHERITE_SCRAP
  - ENCHANTED_BOOK
  - TRIDENT
  - ELYTRA
  - SHULKER_BOX
  - DRAGON_EGG

messages:
  no-permission: '&8【&aVelioraClearLag&8】 &cKamu tidak punya izin.'
  warning: '&8【&aVelioraClearLag&8】 &eItem di tanah akan dibersihkan dalam &f%time% &edetik.'
  cleared: '&8【&aVelioraClearLag&8】 &aMembersihkan &f%amount% &aitem agar server tetap ringan.'
  no-items: '&8【&aVelioraClearLag&8】 &7Tidak ada item yang perlu dibersihkan.'
  manual-clear: '&8【&aVelioraClearLag&8】 &aAdmin &f%player% &amembersihkan &f%amount% &aitem.'
  reload: '&8【&aVelioraClearLag&8】 &aConfig berhasil direload.'
