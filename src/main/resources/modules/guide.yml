  rules:
    display-name: 'Rules Server'
    pages:
      1:
        title: '&cAturan Umum'
        lines:
          - '&8[ &cAturan Umum &8]'
          - '&f- Dilarang berkata toxic, menghina, atau rasis.'
          - '&f- Dilarang spam chat atau flood.'
          - '&f- Dilarang promosi tanpa izin.'
          - '&f- Wajib saling menghargai.'
          - '&f- Gunakan bahasa yang sopan.'
      2:
        title: '&cGameplay'
        lines:
          - '&8[ &cGameplay &8]'
          - '&f- Dilarang cheat, hack, x-ray, atau mod ilegal.'
          - '&f- Dilarang bug abuse atau exploit.'
          - '&f- Wajib lapor jika menemukan bug.'
          - '&f- Dilarang memanfaatkan bug sistem.'
      3:
        title: '&cBoss dan Mob'
        lines:
          - '&8[ &cBoss dan Mob &8]'
          - '&f- Dilarang spam kill dragon.'
          - '&f- Warden maksimal 2x kill.'
          - '&f- Cooldown warden 2 hari.'
          - '&f- Jangan merusak event boss.'
      4:
        title: '&cEkonomi'
        lines:
