settings:
  enabled: true
  spawn:
    enabled: true
    interval-minutes: 60
    retry-minutes: 5
    despawn-minutes: 35
    announce-spawn: true
    announce-death: true
    announce-despawn: true
    allow-multiple-active: false
    require-spawn-point: true
    warning-times-minutes: [5, 1]
  boss-size:
    random-enabled: true
    min: 3.2
    max: 6.0
  combat:
    armor: 18.0
    armor-toughness: 12.0
    knockback-resistance: 0.85
    health-scale-by-nearby-players: true
    health-per-player-multiplier: 0.18
