name: VelioraSuite
version: 1.2.0
main: id.velioragardens.veliorasuite.VelioraSuite
api-version: '1.21'
author: XandMe
description: Clean modular plugin suite for Veliora Gardens.

softdepend:
  - Vault
  - PlaceholderAPI
  - LuckPerms
  - Essentials
  - EconomyShopGUI
  - RedProtect
  - SkinsRestorer
  - GSit
  - Geyser-Spigot
  - floodgate

commands:
  veliorasuite:
    description: Main command for VelioraSuite.
    usage: /veliorasuite
    aliases: [vsuite, vs]
    permission: veliorasuite.admin
  velioraguide:
    description: Open Veliora guide pages.
    usage: /velioraguide [page|reload]
    aliases: [vguide]
    permission: veliorasuite.guide.use
  veliorarules:
    description: Open Veliora rules pages.
    usage: /veliorarules [page]
    aliases: [vrules]
    permission: veliorasuite.guide.use
  velioraproduct:
    description: Open Veliora product pages.
    usage: /velioraproduct [page]
    aliases: [vproduct]
    permission: veliorasuite.guide.use
  veliorarank:
    description: Open Veliora rank shop guide.
    usage: /veliorarank [page]
    aliases: [vrank]
    permission: veliorasuite.guide.use
  velioraannouncement:
    description: Manage Veliora automatic announcements.
    usage: /velioraannouncement <help|status|list|reload|send>
    aliases: [vannounce, vann, va]
  kits:
    description: Open and claim Veliora kits.
    usage: /kits <help|open|list|claim|preview|buy|cooldown|reload>
    aliases: [veliorakits, vkits]
  report:
    description: Create a VelioraReport player or bug report.
    usage: /report <player|bug> <reason>
    aliases: [vreport]
  reports:
    description: Manage VelioraReport reports.
    usage: /reports <list|view|close|reopen|reload>
    aliases: [vreports]
  team:
    description: Manage VelioraTeam teams.
    usage: /team <help|create|invite|accept|leave|list|chat|upgrade|setowner|delete|info|reload>
  veliorachat:
    description: Manage VelioraChat.
    usage: /veliorachat <help|status|reload>
    aliases: [vchat, vc]
  vclearlag:
    description: Manage VelioraClearLag.
    usage: /vclearlag <help|status|reload|clear|tps|memory>
    aliases: [vcl, clearlag, lagg]
    permission: veliorasuite.clearlag.status
  register:
    description: Register your Veliora account.
    usage: /register <password> <password confirm>
    aliases: [reg]
    permission: veliorasuite.loginsecurity.use
  login:
    description: Login to your Veliora account.
    usage: /login <password>
    aliases: [l]
    permission: veliorasuite.loginsecurity.use
  changepass:
    description: Change your Veliora password.
    usage: /changepass <old> <new>
    aliases: [changepassword]
    permission: veliorasuite.loginsecurity.use
  unregister:
    description: Unregister your Veliora account.
    usage: /unregister <password>
    permission: veliorasuite.loginsecurity.use
  logout:
    description: Logout from your Veliora account.
    usage: /logout
    permission: veliorasuite.loginsecurity.use
  risetpw:
    description: Reset a player's Veliora password.
    usage: /risetpw <playername>
    aliases: [resetpw]
  cpowner:
    description: Change a player's Veliora password as owner.
    usage: /cpowner <playername> <new>
  loginsecurity:
    description: Manage VelioraLoginSecurity.
    usage: /loginsecurity <help|reload|status>
    aliases: [vlogsec, vlogin]
    permission: veliorasuite.loginsecurity.admin

permissions:
  veliorasuite.admin:
    default: op
  veliorasuite.bypass:
    default: op
  veliorasuite.guide.use:
    default: true
  veliorasuite.guide.admin:
    default: op
  veliorasuite.announcement.admin:
    default: op
  veliorasuite.announcement.reload:
    default: op
  veliorasuite.announcement.send:
    default: op
  veliorasuite.announcement.status:
    default: op
  veliorasuite.kits.use:
    default: true
  veliorasuite.kits.admin:
    default: op
  veliorasuite.kits.reload:
    default: op
  veliorasuite.kits.bypasscooldown:
    default: op
  veliorasuite.kits.bypassprice:
    default: op
  veliorasuite.report.use:
    default: true
  veliorasuite.report.staff:
    default: op
  veliorasuite.report.admin:
    default: op
  veliorasuite.report.reload:
    default: op
  veliorasuite.report.bypasscooldown:
    default: op
  veliorasuite.team.use:
    default: true
  veliorasuite.team.admin:
    default: op
  veliorasuite.team.reload:
    default: op
  veliorasuite.team.setowner:
    default: op
  veliorasuite.team.delete:
    default: op
  veliorasuite.team.bypasscost:
    default: op
  veliorasuite.team.bypasslimit:
    default: op
  veliorasuite.chat.use:
    default: true
  veliorasuite.chat.admin:
    default: op
  veliorasuite.chat.reload:
    default: op
  veliorasuite.chat.bypasscooldown:
    default: op
  veliorasuite.chat.bypasscommandcooldown:
    default: op
  veliorasuite.chat.bypassfilter:
    default: op
  veliorasuite.loginsecurity.use:
    default: true
  veliorasuite.loginsecurity.admin:
    default: op
  veliorasuite.loginsecurity.owner:
    default: op
  veliorasuite.loginsecurity.bypass:
    default: op
  veliorasuite.clearlag.admin:
    default: op
  veliorasuite.clearlag.reload:
    default: op
  veliorasuite.clearlag.clear:
    default: op
  veliorasuite.clearlag.status:
    default: op
  veliorasuite.clearlag.bypass:
    default: op
