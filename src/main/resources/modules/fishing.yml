# =========================================================
# VELIORAFISHING CONFIG
# =========================================================
# Fungsi:
# - Sistem fishing custom tanpa AuraSkills.
# - Ada ikan vanilla, common, epic, legend, mythic, secret/mitologi, treasure, dan trash.
# - Ikan custom punya harga, berat, origin, dan rarity.
# Command:
# - /vf top      -> ranking pemancing
# - /vf stats    -> statistik kamu
# - /vf sell     -> buka GUI jual semua ikan custom
# - /vf reload   -> reload config, khusus admin
# Cara edit:
# - Tambahkan ikan di bagian catches.<rarity>
# - rarity-chance adalah persen peluang. Semakin kecil semakin langka.
# =========================================================

enabled: true

rarity-chance:
  trash: 30.0
  vanilla: 35.0
  common: 22.0
  epic: 8.0
  legend: 3.0
  mythic: 1.5
  secret: 0.5

broadcast-rarities:
  - LEGEND
  - MYTHIC
  - SECRET


minigame:
  enabled: true
  # Sampah dan vanilla tidak masuk minigame supaya player tidak capek.
  rarities: [COMMON, EPIC, LEGEND, MYTHIC, SECRET]
  bar-length: 20
  # Semakin kecil target-width, semakin susah.
  target-width:
    common: 6
    epic: 5
    legend: 4
    mythic: 3
    secret: 2
  time-seconds:
    common: 7
    epic: 6
    legend: 5
    mythic: 5
    secret: 4
  actionbar: '&aTarik ikan! &f%bar% &7Klik saat penanda ada di warna kuning!'

sell-gui:
  enabled: true
  title: '&8Jual Ikan Veliora'
  size: 54

item-lore:
  - '&7Rarity: &f%rarity%'
  - '&7Origin: &f%origin%'
  - '&7Weight: &f%weight% kg'
  - '&7Price: &a$%price%'
  - '&7Caught by: &f%player%'

messages:
  prefix: '&8【&aVelioraFishing&8】'
  broadcast: '%prefix% &f%player% &aberhasil mendapatkan &f%rarity%&a: &f%fish%&a!'
  not-fish: '%prefix% &cItem di tanganmu bukan ikan custom VelioraFishing.'
  no-economy: '%prefix% &cVault economy tidak ditemukan, ikan belum bisa dijual.'
  sell-success: '%prefix% &aIkan berhasil dijual seharga &e$%price%&a.'
  minigame-start: '%prefix% &eTarikan kuat! Ikan &f%rarity% &emenggigit. Klik saat bar berada di warna kuning!'
  minigame-success: '%prefix% &aBerhasil menarik &f%fish% &7(%rarity%)&a!'
  minigame-fail: '%prefix% &cIkannya lepas karena timing kamu kurang tepat.'
  reload: '%prefix% &aConfig fishing berhasil direload.'

