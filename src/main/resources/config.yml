# =========================================================
# VELIORASUITE CONFIG
# =========================================================
# Ini adalah config utama VelioraSuite.
#
# Compatibility:
# - Target server: Paper/Purpur 1.21.8 + Java 21.
# - Java 21 recommended untuk runtime server.
# - Java 25 may work as runtime, tapi bukan target utama.
# - Plugin harus tetap compile Java 21 agar kompatibel dan stabil.
# - Jangan pakai API Java 25 atau fitur bahasa Java 25.
#
# Cara pakai:
# - Ubah enabled menjadi true/false untuk menyalakan atau mematikan module.
# - Setelah edit config, jalankan /vs reload.
# - Kalau ada perubahan besar, lebih aman restart server.
#
# Catatan:
# - Status module utama bisa dilihat di modules.yml.
# - Config detail module ada di folder modules/.
# =========================================================

settings:
  debug: false
  prefix: '&8[&bVeliora&3Suite&8] &r'
  brand-version: 1
  # Runtime player data will move here in stages. Do not delete this folder.
  database-file: 'database/veliora.db'

# Efek hanya dikirim ke pemain di dekat lokasi. Batas ini mencegah gacha,
# fishing, pet, dan quest mengirim partikel tanpa batas saat server ramai.
effects:
  enabled: true
  low-lag: true
  view-distance: 32.0
  max-particles-per-player-per-second: 100
  max-particles-per-burst: 36

modules:
  guide: true
  login-security: true
  team: true
  kits: true
  report: true
  announcement: true
  fishing: true
  trader: true
  boss: true
  pets: true
  security: true
  chat: true
