# VelioraSuite's OWN packet-only ore masking, NOT Paper Anti-Xray settings.
# Experimental: test on a staging server with Java AND Geyser first.
# Requires PacketEvents 2.13.0. Restart required after changing this file.
# Disable Paper anti-xray in defaults AND per-world overrides; never stack masks.
# This protection is automatically restored to true when the plugin starts.
enabled: true

# World names (resolved to real dimension keys at startup/world load).
# boss/lobby/war_world are deliberately absent.
world-names:
  - world
  - world_nether

# Exclusive Y ceiling, rounded down to a section boundary (16 blocks), as in Paper.
# Blocks above this limit are deliberately NOT protected. Full Overworld retained;
# Nether scanning stops at its usual bedrock roof instead of scanning empty sky.
max-block-height:
  world: 320
  world_nether: 128

# Hard limits. No active masked snapshot is evicted (would break ore reveal).
# If full, NEW chunks pass through UNPROTECTED with a rate-limited warning.
# Each recipient has their own snapshot. Tune only after measuring heap/TPS.
max-cached-columns: 2048
max-columns-per-player: 512
max-ores-per-column: 2048

# All ore is concealed in the initial chunk packet, including ore beside natural caves.
# It is restored only when the player is this close AND has an unobstructed line of sight.
# This prevents distant cave ore from becoming an X-ray marker while preserving normal mining.
nearby-reveal-radius: 7

# Safety limitations of this experimental implementation:
# - ore disguises reuse an adjacent terrain block when known; chunk edges use the safe dimension fallback.
# - only ore in the player's nearby unobstructed view is restored to the real state.
# - no bans, fake bait ores, real block edits, forced chunk loads, or tick scanning.
# - already-connected players must reconnect after module enable.
# - custom dimensions exceeding 512 blocks height pass through unprotected.
