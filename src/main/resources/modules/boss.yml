skills:
  enabled: true
  cooldown-seconds: 14
  random-skill: true
  default: [GROUND_SLAM, SUMMON_MINIONS, FIRE_BOMB, PULL_AURA, POISON_CLOUD, RAGE_MODE]
  damage:
    ground-slam: 6.0
    fire-bomb: 8.0
  summon:
    max-minions: 8
    minions-per-cast: 3
    types: [ZOMBIE, HUSK, DROWNED, ZOMBIFIED_PIGLIN]

protection:
  respect-worldguard: false
  respect-redprotect: false
  prevent-block-damage: true
  allow-boss-damage-in-protected-region: true

rewards:
  min-damage-to-reward: 20.0
  min-damage-contribution-percent: 5.0
  reward-cooldown-seconds: 60
  default-money:
    enabled: true
    min: 10000
    max: 150000
  top-damage-bonus:
    enabled: false
    first: { min: 0, max: 0 }
    second: { min: 0, max: 0 }
    third: { min: 0, max: 0 }
  money-total-cap:
    enabled: true
    max-per-player: 150000
  materials:
    common: { diamond: 0, ancient-debris: 0 }
    rare: { diamond: 1, ancient-debris: 0 }
    epic: { diamond: 2, ancient-debris: 0 }
    legendary: { diamond: 3, ancient-debris: 1 }
    mythic: { diamond: 4, ancient-debris: 2 }

