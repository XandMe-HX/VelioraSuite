# =========================================================
# VELIORAKITS CONFIG
# =========================================================
# Fungsi:
# - Mengganti Essentials /kit dengan GUI kit punya VelioraSuite.
# - Player cukup ketik /kit atau /kits, lalu klik item di GUI.
# - Kit bisa gratis, butuh permission, bayar coin, atau permission + coin.
# - Premium Kit dikunci pakai permission LuckPerms.
#
# Cara pakai player:
# - /kit
# - /kits
# Keduanya akan membuka GUI kit.
#
# Cara pakai admin:
# - /vkit reload                    -> reload config kits setelah diedit
# - /vkits give <player> <kit>       -> memberi kit ke player tanpa cooldown/biaya
# - /vkits reset <player> <kit>      -> reset cooldown kit player
#
# Cara setting harga:
# price.enabled: true  -> kit harus dibeli pakai coin/Vault
# price.enabled: false -> kit gratis
# price.amount: 25000  -> harga kit
#
# Cara setting permission premium:
# - isi permission: 'veliorasuite.kits.premium.1'
# - lalu kasih permission itu ke rank LuckPerms.
# Contoh LuckPerms:
# /lp group premium permission set veliorasuite.kits.premium.1 true
# /lp group premiumplus permission set veliorasuite.kits.premium.2 true
# /lp group ultimate permission set veliorasuite.kits.premium.3 true
#
# Catatan penting:
# - Matikan command /kit dan /kits di Essentials agar tidak bentrok.
# - Jangan hapus spasi YAML.
# - Material wajib pakai nama item Minecraft/Paper, contoh: DIAMOND_SWORD.
# - Enchant format: 'ENCHANT:LEVEL', contoh: 'PROTECTION:2'.
# =========================================================

enabled: true

