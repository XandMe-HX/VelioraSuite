# ==================================================
# VelioraLoginSecurity Configuration
# ==================================================
# Module register/login/password untuk Veliora Gardens.
#
# Command:
# /register <password> <password confirm>
# /reg <password> <password confirm>
# /r <password> <password confirm>  # pre-auth only
# /login <password>
# /l <password>
# /changepass <old> <new>
# /unregister <password>
# /logout
#
# Owner command:
# /risetpw <playername>
# /resetpw <playername>
# /cpowner <playername> <new>
# ==================================================

settings:
  enabled: true
  prefix: '&8[&bVelioraLogin&8] '

  require-login: true
  min-password-length: 5
  max-password-length: 32

  hashing:
    algorithm: 'PBKDF2WithHmacSHA256'
    iterations: 120000
    key-length: 256
    salt-length: 16

  max-login-attempts: 5
  lock-seconds: 60
  auth-timeout-seconds: 120

  block-movement-before-login: true
  allowed-move-distance-before-login: 0.2
  block-chat-before-login: true
  block-actions-before-login: true

  blind-before-login:
    enabled: true
    duration-ticks: 999999
    amplifier: 0
    particles: false
    icon: false

  allowed-commands-before-login:
    - '/login'
    - '/l'
    - '/register'
    - '/reg'
    - '/r'

  pre-auth-shortcuts:
    enabled: true
    register:
      - '/r'
    login:
      - '/l'

  owner-uuids:
    - 'isi-uuid-owner-di-sini'

permissions:
  use: 'veliorasuite.loginsecurity.use'
  admin: 'veliorasuite.loginsecurity.admin'
  owner: 'veliorasuite.loginsecurity.owner'
  bypass: 'veliorasuite.loginsecurity.bypass'

messages:
  no-permission: '%prefix% &cKamu tidak punya izin.'
  player-only: '%prefix% &cCommand ini hanya bisa digunakan oleh player.'
  reload-success: '%prefix% &aVelioraLoginSecurity berhasil direload.'

  need-register: '%prefix% &eKamu belum punya akun di server ini. Ketik &f/register <password> <password>&e. Contoh: &f/register rahasia123 rahasia123&e. Password harus sama dua kali dan dipakai lagi saat login nanti.'
  need-login: '%prefix% &eAkun kamu sudah terdaftar. Ketik &f/login <password>&e untuk masuk. Contoh: &f/login rahasia123&e. Kalau lupa password, hubungi staff.'
  already-registered: '%prefix% &cAkun kamu sudah terdaftar. Gunakan &f/login <password>&c, bukan register ulang.'
  not-registered: '%prefix% &cAkun kamu belum terdaftar. Daftar dulu dengan &f/register <password> <password>&c.'
  already-logged-in: '%prefix% &aKamu sudah login dan bisa bermain.'
  not-logged-in: '%prefix% &cKamu belum login.'

  register-usage: '%prefix% &cCara daftar: &f/register <password> <password> &7contoh: &f/register rahasia123 rahasia123 &7atau &f/r rahasia123 rahasia123'
  login-usage: '%prefix% &cCara login: &f/login <password> &7contoh: &f/login rahasia123 &7atau &f/l rahasia123'
  changepass-usage: '%prefix% &cGunakan: &f/changepass <password_lama> <password_baru>'
  unregister-usage: '%prefix% &cGunakan: &f/unregister <password>'
  risetpw-usage: '%prefix% &cGunakan: &f/risetpw <playername>'
  cpowner-usage: '%prefix% &cGunakan: &f/cpowner <playername> <password_baru>'

  password-not-match: '%prefix% &cPassword konfirmasi tidak sama. Tulis password yang sama dua kali.'
  password-too-short: '%prefix% &cPassword terlalu pendek. Minimal &f%min% &ckarakter.'
  password-too-long: '%prefix% &cPassword terlalu panjang. Maksimal &f%max% &ckarakter.'
  wrong-password: '%prefix% &cPassword salah. Coba lagi pelan-pelan, jangan pakai spasi.'
  account-locked: '%prefix% &cAkun sementara terkunci karena terlalu sering salah password. Coba lagi dalam &f%time%s&c.'
  login-success: '%prefix% &aLogin berhasil. Sekarang kamu bisa bergerak, chat, dan memakai command.'
  register-success: '%prefix% &aRegistrasi berhasil. Ingat password kamu, nanti dipakai untuk &f/login&a.'
  logout-success: '%prefix% &aKamu berhasil logout. Untuk bermain lagi, gunakan &f/login <password>&a.'
  changepass-success: '%prefix% &aPassword berhasil diganti.'
  unregister-success: '%prefix% &aAkun login kamu berhasil dihapus. Kamu harus register ulang untuk bermain.'
  auth-required-command: '%prefix% &cKamu belum login/register. Pakai &f/login <password> &catau &f/register <password> <password>&c dulu.'
  auth-required-chat: '%prefix% &cKamu belum login/register, jadi belum bisa chat. Ikuti instruksi login di chat.'
  auth-required-action: '%prefix% &cKamu belum login/register, jadi belum bisa bergerak/interaksi. Ikuti instruksi login di chat.'
  auth-timeout-kick: '&cKamu terlalu lama tidak login/register. Join ulang lalu ikuti instruksi di chat.'

  owner-reset-success: '%prefix% &aPassword player &f%player% &aberhasil direset. Player harus register ulang.'
  owner-changepass-success: '%prefix% &aPassword player &f%player% &aberhasil diubah.'
  target-not-found: '%prefix% &cData player &f%player% &ctidak ditemukan.'

  help:
    - '&8&m--------------------------------'
    - '&b&lVelioraLoginSecurity'
    - '&f/register <password> <confirm> &7- Daftar akun pertama kali.'
    - '&f/r <password> <confirm> &7- Shortcut daftar sebelum login.'
    - '&f/login <password> &7- Login akun setelah pernah daftar.'
    - '&f/l <password> &7- Shortcut login.'
    - '&f/changepass <old> <new> &7- Ganti password.'
    - '&f/unregister <password> &7- Hapus akun login.'
    - '&f/logout &7- Logout akun.'
    - '&8&m--------------------------------'

  help-owner:
    - '&8&m--------------------------------'
    - '&b&lVelioraLoginSecurity Owner'
    - '&f/risetpw <playername> &7- Reset password player.'
    - '&f/cpowner <playername> <new> &7- Ubah password player.'
    - '&8&m--------------------------------'

  status:
    - '&8&m--------------------------------'
    - '&b&lVelioraLoginSecurity Status'
    - '&7Enabled: &f%enabled%'
    - '&7Require Login: &f%require_login%'
    - '&7Registered Accounts: &f%accounts%'
    - '&7Active Sessions: &f%sessions%'
    - '&7Max Attempts: &f%max_attempts%'
    - '&7Lock Seconds: &f%lock_seconds%'
    - '&7Hashing: &f%hashing%'
    - '&8&m--------------------------------'
