name: VelioraSuite
version: 1.1.0
main: id.velioragardens.veliorasuite.VelioraSuite
api-version: '1.21'
author: Veliora Gardens
description: Modular Minecraft plugin suite for Veliora Gardens.
website: https://github.com/XandMe-HX/VelioraSuite

softdepend:
  - Vault
  - PlaceholderAPI
  - LuckPerms
  - Geyser-Spigot
  - floodgate
  - SkinsRestorer
  - GSit
  - Citizens
  - DecentHolograms
  - ExcellentCrates
  - Essentials
  - EssentialsChat
  - RedProtect
  - BetterRTP
  - EconomyShopGUI

commands:
  veliorasuite:
    description: Main command for VelioraSuite.
    aliases: [vsuite, vs]
    permission: veliorasuite.admin

  vteam:
    description: VelioraTeam command.
    aliases: [veliorateam]

  yes:
    description: Confirm pending VelioraSuite action.
  no:
    description: Cancel pending VelioraSuite action.

  velioraguide:
    description: Show Veliora Gardens player guide.
    aliases: [vguide, guide]
  veliorarules:
    description: Show Veliora Gardens server rules.
    aliases: [vrules, rules]
  velioraproduct:
    description: Show Veliora Gardens product guide.
    aliases: [vproduct, product]

  vsecurity:
    description: Manage VelioraSecurity.
    permission: veliorasuite.security.admin

  register:
    description: Register your Veliora account.
  login:
    description: Login to your Veliora account.
  logout:
    description: Logout from your Veliora account.
  changepass:
    description: Change your Veliora account password.
  vls:
    description: Admin command for Veliora Login Security.
    permission: veliorasuite.login.admin

  report:
    description: Report a player.
  bugreport:
    description: Report a bug/problem.
  vreport:
    description: Admin report command.
    permission: veliorasuite.report.admin

  vannounce:
    description: Admin announcement command.
    permission: veliorasuite.announcement.admin

  kit:
    description: Open VelioraKits GUI.
    aliases: [kits]
  vkit:
    description: Admin command for VelioraKits.
    permission: veliorasuite.kits.admin
  vkits:
    description: Admin command for VelioraKits.
    permission: veliorasuite.kits.admin

  vf:
    description: VelioraFishing command.
    aliases: [veliorafishing]

permissions:
  veliorasuite.admin:
    description: Allows access to VelioraSuite admin commands.
    default: op
  veliorasuite.bypass:
    description: Allows bypassing VelioraSuite restrictions.
    default: op

  veliorasuite.security.admin:
    description: Manage VelioraSecurity.
    default: op
  veliorasuite.security.bypass:
    description: Bypass command security.
    default: op

  veliorasuite.login.admin:
    description: Manage Veliora Login Security.
    default: op
  veliorasuite.login.bypass:
    description: Bypass Veliora Login Security.
    default: op

  veliorasuite.report.admin:
    description: View and manage reports.
    default: op
  veliorasuite.report.banip:
    description: Ban IP from report data.
    default: op

  veliorasuite.announcement.admin:
    description: Manage automatic announcements.
    default: op

  veliorasuite.kits.admin:
    description: Manage VelioraKits.
    default: op
  veliorasuite.kits.premium.1:
    description: Access Premium Kit 1.
    default: false
  veliorasuite.kits.premium.2:
    description: Access Premium Kit 2.
    default: false
  veliorasuite.kits.premium.3:
    description: Access Premium Kit 3.
    default: false

  veliorasuite.team.admin:
    description: Manage VelioraTeam.
    default: op
  veliorasuite.guide.use:
    description: Use VelioraGuide commands.
    default: true
  veliorasuite.guide.admin:
    description: Reload VelioraGuide.
    default: op

  veliorasuite.fishing.admin:
    description: Manage VelioraFishing.
    default: op
  veliorasuite.anti.bypass:
    description: Bypass anti spam, anti caps, and chat protection.
    default: op
  veliorasuite.clearlag.admin:
    description: Allows managing ClearLag module.
    default: op
  veliorasuite.quest.admin:
    description: Allows managing Quest module.
    default: op
  veliorasuite.skills.admin:
    description: Allows managing Skills module.
    default: op
  veliorasuite.trader.admin:
    description: Allows managing Trader module.
    default: op
  veliorasuite.boss.admin:
    description: Allows managing Boss module.
    default: op
  veliorasuite.rewards.admin:
    description: Allows managing Rewards module.
    default: op
  veliorasuite.chat.admin:
    description: Allows managing Chat module.
    default: op
