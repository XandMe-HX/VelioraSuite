settings:
  enabled: true
  prefix: '&8[&6VelioraTrader&8] '
  spawn:
    enabled: true
    interval-minutes: 120
    active-minutes: 30
    random-from-config-locations: true
    announce-spawn: true
    announce-despawn: true
    max-random-attempts: 25
    locations:
      - world: world
        x: 0
        y: 80
        z: 0
      - world: world
        x: 150
        y: 72
        z: -220
  trade:
    random-items-per-spawn: 5
    stock-mode: GLOBAL
    default-stock: 1
    per-player-limit: 1

npc:
  type: WANDERING_TRADER
  name: '&6Veliora Trader'
  silent: true
  gravity: true
  optional-skin:
    enabled: false

companion:
  enabled: true
  type: LLAMA
  frozen: true

camp:
  enabled: true
  restore-on-despawn: true
  blocks:
    - offset: [0, 0, 0]
      material: BARREL
    - offset: [1, 0, 0]
      material: CHEST
    - offset: [0, 0, 1]
      material: CRAFTING_TABLE
    - offset: [-1, 0, 0]
      material: CAMPFIRE
    - offset: [1, 1, 0]
      material: LANTERN
    - offset: [-1, 0, 1]
      material: OAK_PLANKS
    - offset: [-1, 1, 1]
      material: OAK_SLAB
    - offset: [0, 1, -1]
      material: OAK_TRAPDOOR
    - offset: [2, 0, 0]
      material: COMPOSTER

gui:
  title: '&8Veliora Trader'
  size: 27
  trade-slots: [10, 11, 13, 15, 16]
  close-slot: 26

repair-block:
  enabled: true
  blocked-commands:
    - repair
    - fix
    - erepair
    - efix

permissions:
  use: 'veliorasuite.trader.use'
  admin: 'veliorasuite.trader.admin'
  reload: 'veliorasuite.trader.reload'

