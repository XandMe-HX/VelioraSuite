# =========================================================
# VELIORAREPORT CONFIG
# =========================================================
# Fungsi:
# - Player bisa melaporkan player lain atau bug.
# - Report hanya bisa dilihat admin/op dengan permission.
# - ID report adalah nomor laporan, contoh Report #1, #2, #3.
# Command player:
# - /report <player> <alasan>
# - /bugreport <pesan>
# Command admin:
# - /vreport list
# - /vreport info <id>
# - /vreport close <id>
# - /vreport banip <id> <alasan>
# =========================================================

enabled: true
notify-admins: true

messages:
  prefix: '&8【&aVelioraReport&8】'
  usage-report: '%prefix% &eGunakan: &f/report <player> <alasan> &7Contoh: &f/report Player123 cheat hit jauh'
  usage-bugreport: '%prefix% &eGunakan: &f/bugreport <pesan> &7Contoh: &f/bugreport NPC quest tidak bisa diklik'
  report-success: '%prefix% &aReport berhasil dikirim. ID laporan: &f#%id%&a.'
  bug-success: '%prefix% &aBug report berhasil dikirim. ID laporan: &f#%id%&a.'
  admin-notify: '%prefix% &eReport baru &f#%id% &7dari &f%reporter% &7target &f%target% &7alasan: &f%reason%'
  no-permission: '%prefix% &cKamu tidak punya izin.'
  not-found: '%prefix% &cReport #%id% tidak ditemukan.'
  closed: '%prefix% &aReport #%id% berhasil ditutup.'
  banip-success: '%prefix% &aIP dari Report #%id% berhasil diban.'
  banip-failed: '%prefix% &cGagal ban IP dari Report #%id%. Target IP tidak ada/unknown.'
  reload: '%prefix% &aConfig report berhasil direload.'
