# Marketplace native VelioraSuite. Vault + economy provider wajib untuk transaksi uang.
# Semua angka ekonomi ActionHouse diatur dari sini, tanpa perlu edit kode.
shop:
  # Biaya membeli toko pertama kali. Setelah dibeli, nama pemain muncul di toko.
  purchase-price: 10000
  # Jumlah chest yang langsung terbuka untuk pemain baru.
  initial-slots: 8
  # Biaya Vault untuk membuka satu chain (slot) tambahan.
  slot-price: 5000
listing:
  # Barang yang belum dibeli selama durasi ini dipindahkan aman ke Barrel pemain.
  duration-days: 14
promotion:
  # Harga dan lama promosi; urutannya Copper, Iron, Gold, Diamond, Netherite.
  one-day: { price: 5000, days: 1 }
  three-days: { price: 12000, days: 3 }
  seven-days: { price: 25000, days: 7 }
  fourteen-days: { price: 50000, days: 14 }
  thirty-days: { price: 100000, days: 30 }
messages:
  vault-unavailable: '&cEkonomi Vault belum siap; transaksi dibatalkan dengan aman.'
  insufficient-funds: '&cUang kamu tidak cukup.'
  sale-created: '&aBarang berhasil dimasukkan ke toko.'
  sale-cancelled: '&aListing dibatalkan; barang dikembalikan.'
