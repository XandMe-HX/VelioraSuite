# =========================================================
# VELIORAREWARDS CONFIG
# =========================================================
# Fungsi:
# - Daily reward sederhana. Player claim dengan /daily atau /reward.
# - Reward bisa money, vanilla exp, dan item.
#
# Cara pakai player:
# - /daily
# - /reward
#
# Cara pakai admin:
# - /vreward reload
# - /vreward reset <player>
# =========================================================

enabled: true

daily:
  enabled: true
  cooldown-hours: 24
  rewards:
    money: 250
    exp: 25
    items:
      bread:
        material: BREAD
        amount: 16
      torch:
        material: TORCH
        amount: 16

messages:
  no-permission: '&8【&aVelioraRewards&8】 &cKamu tidak punya izin.'
  reload: '&8【&aVelioraRewards&8】 &aConfig berhasil direload.'
  claim: '&8【&aVelioraRewards&8】 &aDaily reward berhasil diclaim. Reward: &e%money% coin &7+ &b%exp% exp&a.'
  cooldown: '&8【&aVelioraRewards&8】 &cDaily reward masih cooldown. Tunggu &e%time%&c.'
