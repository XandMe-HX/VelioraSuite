  sell-gui:
    enabled: true
    title: '&8VelioraFishing Sell'
    size: 54
    allow-vanilla-fish: true

  bag:
    enabled: true
    title: '&8Fish Bag'
    size: 54
    max-pages: 5
    auto-store:
      enabled: false
      rarities: [ORNAMENTAL, EPIC, LEGENDARY, MITOLOGI]

  collection:
    title: '&8Fish Collection'
    size: 54

  top:
    limit: 5
    gui-enabled: false

  quest-integration:
    enabled: true

effects:
  # Semua rarity punya respons berbeda, tetapi jumlahnya kecil supaya tidak membebani client/VPS.
  trash: {enabled: true, sound: BLOCK_NOTE_BLOCK_BASS, particle: SMOKE, amount: 3}
  vanilla: {enabled: true, sound: ENTITY_FISHING_BOBBER_SPLASH, particle: SPLASH, amount: 5}
  common: {enabled: true, sound: ENTITY_EXPERIENCE_ORB_PICKUP, particle: BUBBLE, amount: 7}
  ornamental: {enabled: true, sound: ENTITY_EXPERIENCE_ORB_PICKUP, particle: HAPPY_VILLAGER, amount: 10}
  epic: {enabled: true, sound: ENTITY_PLAYER_LEVELUP, particle: ENCHANT, amount: 20}
  legendary: {enabled: true, sound: UI_TOAST_CHALLENGE_COMPLETE, particle: TOTEM_OF_UNDYING, amount: 35, broadcast: true}
  mitologi: {enabled: true, sound: ENTITY_ENDER_DRAGON_GROWL, particle: DRAGON_BREATH, amount: 60, visual-lightning: true, broadcast: true}
  secret: {enabled: true, sound: ENTITY_WITHER_SPAWN, particle: END_ROD, amount: 90, visual-lightning: true, broadcast: true}

permissions:
  use: 'veliorasuite.fishing.use'
  sell: 'veliorasuite.fishing.sell'
  bag: 'veliorasuite.fishing.bag'
  top: 'veliorasuite.fishing.top'
  admin: 'veliorasuite.fishing.admin'
  reload: 'veliorasuite.fishing.reload'
  rods-bypass: 'veliorasuite.fishing.rods.bypass'

