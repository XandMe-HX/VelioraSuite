# ==================================================
# VelioraAnnouncement Configuration
# ==================================================
# File ini mengatur sistem pengumuman otomatis server.
# Semua pesan, interval, mode, sound, permission, world
# filter, dan isi announcement bisa diubah dari sini.
#
# Command utama:
# - /vannounce help
# - /vannounce status
# - /vannounce list
# - /vannounce reload
# - /vannounce send <id>
#
# Alias:
# - /vann
# - /vannounce
# - /va
#
# Setelah mengubah file ini, jalankan:
# - /vannounce reload
# atau
# - /vs reload
# ==================================================

settings:
  # Mengaktifkan atau mematikan module announcement.
  # true = aktif
  # false = mati
  enabled: true

  # Jika true, scheduler announcement otomatis berjalan saat module aktif.
  # Jika false, announcement hanya bisa dikirim manual dengan /vannounce send <id>.
  auto-start: true

  # Waktu tunggu sebelum announcement otomatis pertama dikirim setelah server start.
  # Satuan: detik
  # Contoh: 60 = 1 menit
  initial-delay-seconds: 60

  # Jeda antar broadcast otomatis dalam detik.
  # Default aman untuk survival/MMORPG: 300 detik atau 5 menit.
  # Contoh:
  # 300 = 5 menit
  # 600 = 10 menit
  # Minimal aman dari plugin: 10 detik.
  interval-seconds: 300

  # Mode broadcast otomatis.
  # SEQUENTIAL = berurutan dari atas ke bawah
  # RANDOM = acak
  mode: SEQUENTIAL

  # Jika mode RANDOM aktif, opsi ini mencegah pesan yang sama
  # muncul dua kali berturut-turut jika jumlah announcement lebih dari 1.
  random-avoid-repeat: true

  # Prefix default untuk announcement.
  # Prefix akan ditambahkan pada baris pertama announcement.
  prefix: '&8[&bVeliora&8] '

sound:
  # Sound saat announcement dikirim ke player.
  # true = aktif
  # false = mati
  enabled: true

  # Nama sound Minecraft/Paper.
  # Contoh:
  # ENTITY_EXPERIENCE_ORB_PICKUP
  # BLOCK_NOTE_BLOCK_PLING
  name: 'ENTITY_EXPERIENCE_ORB_PICKUP'

  # Volume sound.
  # Contoh: 0.5 pelan, 1.0 normal, 2.0 keras.
  volume: 1.0

  # Pitch sound.
  # Contoh: 1.0 normal, 1.2 sedikit tinggi.
  pitch: 1.2

commands:
  # Section ini untuk dokumentasi command di config.
  # Command asli tetap didaftarkan lewat plugin.yml.
  main: '/vannounce'
  aliases:
    - '/vann'
    - '/va'
  examples:
    - '/vannounce help'
    - '/vannounce status'
    - '/vannounce list'
    - '/vannounce reload'
    - '/vannounce send welcome'

permissions:
  # Permission penuh untuk semua fitur announcement.
  admin: 'veliorasuite.announcement.admin'

  # Permission untuk melihat status dan list announcement.
  status: 'veliorasuite.announcement.status'

  # Permission untuk reload config announcement.
  reload: 'veliorasuite.announcement.reload'

  # Permission untuk mengirim announcement manual.
  send: 'veliorasuite.announcement.send'

messages:
  # Semua pesan command VelioraAnnouncement bisa diedit di sini.
  prefix: '&8[&bVelioraAnnouncement&8]'

  no-permission: '%prefix% &cKamu tidak punya izin.'
  reload-success: '%prefix% &aAnnouncement berhasil direload dan task sudah direstart dengan aman.'
  send-success: '%prefix% &aAnnouncement &f%id% &aberhasil dikirim.'
  not-found: '%prefix% &cAnnouncement &f%id% &ctidak ditemukan atau sedang nonaktif.'
  usage-send: '%prefix% &cGunakan: &f/vannounce send <id>'

  help:
    - '&8&m--------------------------------'
    - '&b&lVelioraAnnouncement'
    - '&f/vannounce help &7- Melihat bantuan command.'
    - '&f/vannounce status &7- Melihat status module.'
    - '&f/vannounce list &7- Melihat ID aktif.'
    - '&f/vannounce reload &7- Reload config dan task.'
    - '&f/vannounce send <id> &7- Kirim manual.'
    - '&8&m--------------------------------'

  status:
    - '&8&m--------------------------------'
    - '&b&lVelioraAnnouncement Status'
    - '&7Enabled: &f%enabled%'
    - '&7Running: &f%running%'
    - '&7Auto Start: &f%auto_start%'
    - '&7Mode: &f%mode%'
    - '&7Interval: &f%interval%s'
    - '&7Total Announcement Aktif: &f%total%'
    - '&8&m--------------------------------'

  list-header: '&8&m--------------------------------'
  list-title: '&b&lAnnouncement Aktif'
  list-format: '&7- &f%id%'
  list-empty: '%prefix% &cTidak ada announcement aktif.'
  list-footer: '&8&m--------------------------------'

announcements:
  welcome:
    # Aktifkan atau matikan announcement ini.
    enabled: true

    # Permission khusus untuk menerima announcement ini.
    # Kosongkan agar semua player bisa melihat.
    permission: ''

    # World yang bisa menerima announcement ini.
    # Kosongkan [] agar semua world bisa menerima.
    # Contoh:
    # worlds:
    #   - 'world'
    #   - 'survival'
    worlds: []

    # Isi pesan announcement.
    # Bisa lebih dari 1 baris.
    # Prefix dari settings.prefix otomatis muncul di baris pertama.
    lines:
      - '&bVeliora Gardens &7adalah server survival MMORPG cozy.'
      - '&7Gunakan &f/vguide &7untuk melihat panduan server.'

  rules:
    enabled: true
    permission: ''
    worlds: []
    lines:
      - '&eJangan lupa baca rules server.'
      - '&7Gunakan &f/vrules &7untuk melihat aturan.'

  product:
    enabled: true
    permission: ''
    worlds: []
    lines:
      - '&bMau lihat fitur server?'
      - '&7Gunakan &f/vproduct &7untuk melihat product dan fitur Veliora.'

  shop:
    enabled: true
    permission: ''
    worlds: []
    lines:
      - '&aButuh item atau ingin jual hasil farming?'
      - '&7Gunakan &f/shop &7atau &f/sellgui&7.'

  fishing:
    enabled: true
    permission: ''
    worlds: []
    lines:
      - '&bSuka mancing?'
      - '&7Gunakan &f/vf top &7untuk melihat top pemancing.'

  claim:
    enabled: true
    permission: ''
    worlds: []
    lines:
      - '&aJangan lupa amankan base kamu.'
      - '&7Claim area agar bangunan tidak mudah diganggu player lain.'

  report:
    enabled: true
    permission: ''
    worlds: []
    lines:
      - '&cMelihat player mencurigakan atau menemukan bug?'
      - '&7Laporkan ke staff agar bisa dicek.'

  discord:
    enabled: false
    permission: ''
    worlds: []
    lines:
      - '&bGabung Discord Veliora Gardens untuk info event terbaru.'
      - '&7Link Discord bisa ditambahkan oleh staff di config ini.'
