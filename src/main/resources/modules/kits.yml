# =========================================================
# VELIORAKITS CONFIG
# =========================================================
# Fungsi:
# - Mengganti Essentials /kit dengan GUI kit punya VelioraSuite.
# - Player cukup ketik /kit atau /kits, lalu klik item di GUI.
# - Premium Kit dikunci pakai permission LuckPerms.
# Cara pakai admin:
# - /vkit reload
# - /vkits give <player> <kit>
# - /vkits reset <player> <kit>
# Permission premium:
# - veliorasuite.kits.premium.1
# - veliorasuite.kits.premium.2
# - veliorasuite.kits.premium.3
# Catatan:
# - Matikan /kit Essentials agar tidak bentrok.
# =========================================================

enabled: true

gui:
  title: '&8Veliora Kits'
  size: 27

messages:
  prefix: '&8【&aVelioraKits&8】'
  claim-success: '%prefix% &aKamu berhasil mengambil kit &f%kit%&a.'
  no-permission-kit: '%prefix% &cKamu belum punya akses ke kit ini.'
  cooldown: '%prefix% &cKit ini belum bisa diambil. Tunggu &f%time%&c.'
  kit-not-found: '%prefix% &cKit &f%kit% &ctidak ditemukan.'
  not-enough-space: '%prefix% &cInventory penuh. Item sisa dijatuhkan ke tanah.'

kits:
  starter:
    enabled: true
    slot: 10
    permission: ''
    cooldown: 'once'
    display:
      material: CHEST
      locked-material: BARRIER
      name: '&aStarter Kit'
      lore:
        - '&7Kit awal untuk semua player.'
        - '&7Status: %status%'
        - ''
        - '&eKlik untuk claim.'
    items:
      - material: LEATHER_HELMET
        amount: 1
      - material: LEATHER_CHESTPLATE
        amount: 1
      - material: LEATHER_LEGGINGS
        amount: 1
      - material: LEATHER_BOOTS
        amount: 1
      - material: STONE_SWORD
        amount: 1
      - material: STONE_PICKAXE
        amount: 1
      - material: STONE_AXE
        amount: 1
      - material: STONE_SHOVEL
        amount: 1
      - material: OAK_FENCE
        amount: 64
