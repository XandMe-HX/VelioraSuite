settings:
  enabled: true
  prefix: '&7[&eVELIORA &aFISHING&7] &r'

  # Kepala ikan Legendry, Mitologi, dan Secret memakai texture tetap dari Mojang.
  # Nilai texture-base64 dari minecraft-heads.com langsung didukung. Alternatif yang lebih
  # mudah: isi head.texture-url dengan https://textures.minecraft.net/texture/<hash>, lalu /fish reload.
  # Jangan pakai URL gambar CraftHead/Crafatar/Minotar karena itu hanya gambar untuk website.

  rarity-chance:
    trash: 24.0
    vanilla: 20.0
    common: 52.5
    ornamental: 3.0
    epic: 0.42
    legendary: 0.07
    mitologi: 0.009
    secret: 0.001

  price:
    trash: {min: 1, max: 1, max-final: 1}
    vanilla: {min: 3, max: 8, max-final: 10}
    common: {min: 8, max: 18, max-final: 24}
    ornamental: {min: 20, max: 55, max-final: 75}
    epic: {min: 75, max: 180, max-final: 240}
    legendary: {min: 350, max: 900, max-final: 1200}
    mitologi: {min: 1500, max: 3500, max-final: 5000}
    secret: {min: 5000, max: 12000, max-final: 18000}

  mutations:
    gold: {chance: 1.4, price-multiplier: 2.0}
    ghost: {chance: 1.2, price-multiplier: 2.4}
    radioactive: {chance: 1.0, price-multiplier: 3.0}
    lightning: {chance: 0.9, price-multiplier: 3.5}
    midnight: {chance: 0.8, price-multiplier: 4.0}
    fairy-dust: {chance: 0.7, price-multiplier: 4.5}
    gemstone: {chance: 0.6, price-multiplier: 5.0}
    corrupt: {chance: 0.5, price-multiplier: 6.0}

  potions:
    # Dibeli dengan Koin Fishing. Klik dua kali mencegah pembelian tidak sengaja.
    luck: {price: 750, duration-seconds: 600}
    mutation: {price: 1000, duration-seconds: 600}
    lure: {price: 750, duration-seconds: 600}

  trade:
    enabled: true
    request-timeout-seconds: 60
    countdown-seconds: 3
    max-distance: 10.0

  minigame:
    enabled: true
    trigger-chance: 100.0
    mode: SPAM_CLICK
    click-cooldown-ms: 40
    show-title: true
    remove-vanilla-caught-entity: true
    difficulty:
      trash: {enabled: false, spam-needed: 0, seconds: 0.0}
      # Mode hard: makin langka makin panik, tetapi tetap mungkin untuk pemain manusia.
      vanilla: {enabled: true, spam-needed: 8, seconds: 4.0}
      common: {enabled: true, spam-needed: 14, seconds: 5.0}
      ornamental: {enabled: true, spam-needed: 24, seconds: 6.0}
      epic: {enabled: true, spam-needed: 36, seconds: 7.0}
      legendary: {enabled: true, spam-needed: 55, seconds: 8.0}
      mitologi: {enabled: true, spam-needed: 80, seconds: 10.0}
      secret: {enabled: true, spam-needed: 110, seconds: 12.0}

  # NONE means normal catches do not fill chat. Legendary/Mythic still use their global broadcast.
  catch-message-min-rarity: NONE

  rods:
    enabled: true
    bypass-permission: 'veliorasuite.fishing.rods.bypass'
    # Harga memakai Koin Fishing, bukan Vault. Semua angka dapat diubah.
    items:
      starter: {tier: 1, name: 'Starter Rod', gradient-from: '#B8FFB0', gradient-to: '#FFFFFF', price: 0, required-catches: 0, seconds-bonus: 0, click-reduction: 0, luck: 0, max-weight: 10, speed: 0, quest: false, aura: 'Awal perjalanan pemancing.'}
      luck: {tier: 2, name: 'Luck Rod', gradient-from: '#7CFF93', gradient-to: '#E8FF9A', price: 250, required-catches: 25, seconds-bonus: 0, click-reduction: 1, luck: 50, max-weight: 15, speed: 2, quest: false, aura: 'Kilau keberuntungan lembut.'}
