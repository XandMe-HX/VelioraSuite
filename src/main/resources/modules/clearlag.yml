# ==================================================
# VelioraClearLag Configuration
# ==================================================
# Module clear lag ringan dan aman untuk Veliora Gardens.
# Fokus server ramah HP kentang.
#
# Tidak menghapus item penting secara default:
# - item bernama
# - item dengan lore
# - item enchant
# - item dengan metadata/tag plugin
# - material yang masuk ignored-materials
# ==================================================

settings:
  enabled: true
  prefix: '&8[&aVelioraClearLag&8] '

  auto-clear:
    enabled: true
    interval-seconds: 300
    warning-seconds:
      - 60
      - 30
      - 10
      - 5
      - 4
      - 3
      - 2
      - 1

  item-cleaner:
    enabled: true
    remove-dropped-items: true
    ignore-named-items: true
    ignore-lore-items: true
    ignore-enchanted-items: true
    ignore-plugin-metadata-items: true
    ignored-materials:
      - DIAMOND
      - EMERALD
      - NETHERITE_INGOT
      - NETHERITE_SCRAP
      - SHULKER_BOX
      - WHITE_SHULKER_BOX
      - BLACK_SHULKER_BOX
      - BLUE_SHULKER_BOX
      - RED_SHULKER_BOX
      - GREEN_SHULKER_BOX
      - YELLOW_SHULKER_BOX
      - PURPLE_SHULKER_BOX
      - PINK_SHULKER_BOX
      - ORANGE_SHULKER_BOX
      - CYAN_SHULKER_BOX
      - LIGHT_BLUE_SHULKER_BOX
      - LIME_SHULKER_BOX
      - MAGENTA_SHULKER_BOX
      - BROWN_SHULKER_BOX
      - GRAY_SHULKER_BOX
      - LIGHT_GRAY_SHULKER_BOX

  mob-cleaner:
    enabled: true
    remove-hostile-mobs: true
    remove-passive-mobs: false
    ignore-named-mobs: true
    ignore-tamed-animals: true
    ignored-entity-types:
      - PLAYER
      - VILLAGER
      - ARMOR_STAND
      - WOLF
      - CAT
      - HORSE
      - DONKEY
      - MULE
      - LLAMA
      - PARROT

  projectile-cleaner:
    enabled: true
    auto-clear: false
    ignored-projectiles:
      - TRIDENT

permissions:
  admin: 'veliorasuite.clearlag.admin'
  reload: 'veliorasuite.clearlag.reload'
  clear: 'veliorasuite.clearlag.clear'
  status: 'veliorasuite.clearlag.status'
  bypass: 'veliorasuite.clearlag.bypass'

messages:
  no-permission: '%prefix% &cKamu tidak punya izin.'
  reload-success: '%prefix% &aVelioraClearLag berhasil direload.'
  clear-warning: '%prefix% &eItem jatuh akan dibersihkan dalam &f%time% &edetik.'
  clear-done: '%prefix% &aBerhasil membersihkan &f%items% &aitem jatuh.'
  clear-mobs-done: '%prefix% &aBerhasil membersihkan &f%mobs% &amob.'
  clear-projectiles-done: '%prefix% &aBerhasil membersihkan &f%projectiles% &aprojectile.'
  no-entities-cleared: '%prefix% &eTidak ada entity yang perlu dibersihkan.'

  help:
    - '&8&m--------------------------------'
    - '&a&lVelioraClearLag'
    - '&f/vclearlag status &7- Cek status clearlag.'
    - '&f/vclearlag clear &7- Clear item jatuh.'
    - '&f/vclearlag clear items &7- Clear item jatuh.'
    - '&f/vclearlag clear mobs &7- Clear mob aman.'
    - '&f/vclearlag clear projectiles &7- Clear projectile.'
    - '&f/vclearlag tps &7- Cek TPS.'
    - '&f/vclearlag memory &7- Cek memory.'
    - '&f/vclearlag reload &7- Reload config.'
    - '&8&m--------------------------------'

  status:
    - '&8&m--------------------------------'
    - '&a&lVelioraClearLag Status'
    - '&7Enabled: &f%enabled%'
    - '&7Auto Clear: &f%auto_clear%'
    - '&7Interval: &f%interval%s'
    - '&7Next Clear: &f%next_clear%s'
    - '&7Warnings: &f%warnings%'
    - '&7Whitelist: &f%whitelist% item'
    - '&7Last Clear: &f%last_clear%'
    - '&7Memory: &f%memory%'
    - '&8&m--------------------------------'
