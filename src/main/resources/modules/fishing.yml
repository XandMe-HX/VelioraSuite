settings:
  enabled: true
  prefix: '&8[&bVelioraFishing&8] '

  rarity-chance:
    trash: 20.0
    vanilla: 15.0
    common: 55.0
    ornamental: 7.0
    rare: 2.5
    legendary: 0.45
    mitologi: 0.05

  price:
    trash:
      min: 1
      max: 5
      max-final: 5
    vanilla:
      min: 50
      max: 100
      max-final: 100
    common:
      min: 100
      max: 500
      max-final: 500
    ornamental:
      min: 500
      max: 2000
      max-final: 2000
    rare:
      min: 2000
      max: 10000
      max-final: 10000
    legendary:
      min: 10000
      max: 75000
      max-final: 75000
    mitologi:
      min: 50000
      max: 150000
      max-final: 500000

  minigame:
    enabled: true
    trigger-chance: 35.0
    mode: SPAM_CLICK
    click-cooldown-ms: 40
    show-title: true
    remove-vanilla-caught-entity: true
    difficulty:
      trash:
        spam-needed: 3
        seconds: 4.0
      vanilla:
        spam-needed: 4
        seconds: 4.0
      common:
        spam-needed: 5
        seconds: 4.0
      ornamental:
        spam-needed: 10
        seconds: 5.0
      rare:
        spam-needed: 18
        seconds: 6.0
      legendary:
        spam-needed: 35
        seconds: 7.0
      mitologi:
        spam-needed: 55
        seconds: 8.0

  sell-gui:
    enabled: true
    title: '&8VelioraFishing Sell'
    size: 54
    allow-vanilla-fish: true

  top:
    limit: 5
    gui-enabled: false

  quest-integration:
    enabled: true

permissions:
  use: 'veliorasuite.fishing.use'
  admin: 'veliorasuite.fishing.admin'
  reload: 'veliorasuite.fishing.reload'

