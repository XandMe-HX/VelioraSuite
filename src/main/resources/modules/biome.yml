# Pengumuman biome bawaan VelioraSuite. Hanya Action Bar sementara;
# tidak membuat TextDisplay permanen atau entity tambahan di chunk.
settings:
  enabled: true
worlds: ["*"]
cooldown-seconds: 30
anti-spam:
  # Perbatasan biome sering berubah tiap 1-2 blok. Biome harus stabil dahulu.
  minimum-biome-stay-seconds: 5
  # Satu biome hanya diumumkan sekali selama sesi login pemain.
  only-first-discovery: true
display:
  announce-on-join: false
  # Tidak memakai title agar layar tidak tertutup saat melewati batas biome.
  actionbar: '&8✦ &fMemasuki &d{biome}'
  fade-in-ticks: 8
  stay-ticks: 45
  fade-out-ticks: 12
  typing:
    enabled: true
    interval-ticks: 2 # satu karakter setiap 0,1 detik
# Semua biome Minecraft tetap otomatis terdeteksi. Tambahkan nama cantik hanya
# untuk biome yang ingin diberi nama server sendiri; selain itu nama vanilla dipakai.
biome-names:
  minecraft_plains: '&aPlains'
  minecraft_forest: '&2Forest'
  minecraft_the_void: '&5The Void'
effects:
  # Animasi lama otomatis dibatalkan saat pemain pindah biome lagi atau logout.
  particles-enabled: true
  particle: END_ROD
  count: 12
  sound: BLOCK_AMETHYST_BLOCK_CHIME
  sound-enabled: true
  sound-volume: 0.45
  sound-pitch: 1.35
