settings:
  enabled: true
  balance-version: 5
  # Memaksa tampilan BossBar lama ikut diperbarui sekali pada server yang sudah berjalan.
  bossbar-version: 3
  arena-version: 4
  spawn:
    enabled: true
    # Spawn mengikuti pergantian jam WIB: 20:00, 21:00, 22:00, dan seterusnya.
    # Contoh set spawn pukul 19:29: timer menunjukkan sekitar 31 menit menuju pukul 20:00.
    schedule-version: 2
    realtime-hourly:
      enabled: true
    # Mode jam tertentu tersedia sebagai pilihan, tetapi default-nya dimatikan.
    daily-schedule:
      enabled: false
      times: ['20:00']
    interval-minutes: 60
    retry-minutes: 5
    despawn-minutes: 30
    announce-spawn: true
    announce-death: true
    announce-despawn: true
    # Jika tidak ada player online, jadwal ditahan dan boss baru spawn saat ada player.
    skip-when-no-players: true
    allow-multiple-active: false
    require-spawn-point: true
    warning-times-minutes: [5, 1]
  notifications:
    # Pesan boss ke player (spawn, mati, despawn, dan peringatan jadwal).
    players: true
    # Log aktivitas normal boss ke console. Nonaktifkan agar console tidak spam.
    console: false
  boss-size:
    random-enabled: true
    min: 3.0
    max: 6.0
  combat:
    # Semua HP definisi boss dikurangi 20% tanpa merusak data boss lama.
    global-health-multiplier: 0.80
    armor: 18.0
    armor-toughness: 12.0
    knockback-resistance: 0.85
    # Collision dimatikan supaya hitbox boss besar tidak terus mendorong player.
    collision-enabled: false
    # Semua serangan boss/skill dikurangi 15%.
    outgoing-damage-multiplier: 0.85
    # Hitbox entity berskala berbeda-beda; izinkan hit vanilla agar bow/sword/mace tidak ditolak.
    anti-reach-enabled: false
    # Hard cap tetap berlaku walaupun config boss salah atau scaling diaktifkan.
    maximum-health: 10000
    # HP virtual dibuat ringkas agar raid tetap cepat dan seru.
    health-scale-by-nearby-players: false
    health-per-player-multiplier: 0.18
    max-health-multiplier: 2.35
    # HP virtual menerima damage final normal; hit tidak lagi terasa seperti kebal.
    virtual-damage-multiplier: 1.0
    # Tiga smash Mace penuh per pemain, lalu cooldown 5 menit.
    mace-damage-multiplier: 1.0
    mace-max-damage-per-hit: 450
    mace-smash-charges: 3
    mace-smash-cooldown-seconds: 300
    # Anti reach hanya membatalkan hit + memberi lock damage sementara, tidak ada auto-ban.
    melee-reach-limit: 6.5
    invalid-reach-limit: 8
    invalid-reach-window-seconds: 30
    invalid-reach-damage-lock-seconds: 120

rarity-chance:
