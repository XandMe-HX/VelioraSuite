skills:
  enabled: true
  cooldown-seconds: 12
  # Semua skill besar memberi tanda selama 1.3 detik agar seram tetapi masih fair.
  telegraph-ticks: 26
  random-skill: true
  default: [GROUND_SLAM, SUMMON_MINIONS, FIRE_BOMB, PULL_AURA, POISON_CLOUD, LIGHTNING_CHAIN, SHADOW_PULSE, SOUL_CAGE, HEAL_PULSE, RAGE_MODE]
  damage:
    ground-slam: 6.0
    fire-bomb: 7.0
    lightning-chain: 5.0
    shadow-pulse: 5.0
    soul-cage: 4.0
  lightning-radius: 8.0
  movement:
    # Efek gerak tetap terasa, tetapi tidak membuat player mental terus-menerus.
    ground-slam-knockback: 0.45
    ground-slam-upward: 0.18
    pull-aura-strength: 0.25
    pull-aura-upward: 0.08
    shadow-pulse-pull-strength: 0.18
