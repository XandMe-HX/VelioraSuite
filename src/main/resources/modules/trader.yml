settings:
  config-version: 6
  enabled: true
  # Trader dibuka lewat /trader; lima penawaran acak berganti tiap jam mengikuti WIB.
  gui-only: true
  prefix: '&7[&eVELIORA &aTRADER&7] &r'
  spawn:
    enabled: false
    # Trader muncul satu kali tiap minggu, pada hari dan jam berikut.
    interval-days: 7
    day-of-week: SUNDAY
    interval-hours: 168
    anchor-hour: 1
    timezone: Asia/Jakarta
    active-minutes: 30
    reminder-minutes: 10
    random-from-config-locations: true
    announce-spawn: true
    announce-despawn: true
    announce-purchase: true
    max-random-attempts: 25
    locations:
      - world: world
        x: 0
        y: 80
        z: 0
      - world: world
        x: 150
        y: 72
        z: -220
  trade:
    # Lima slot tetap tampil. Item dipilih menurut weight setiap item di trade-pool.
    # Angka weight lebih besar = lebih sering muncul dalam kategori item tersebut.
    random-items-per-spawn: 5
    offer-rotation-hours: 1
    # Sebelum transaksi final, pemain melihat efek singkat dan bunyi per detik.
    purchase-animation-seconds: 3
    farm-sell:
      # Hasil farm hanya dapat dijual satu kali oleh setiap pemain setiap minggu.
      weekly-limit: true
    max-money-price: 500000
    # Semua harga MONEY efektif menjadi 80% dari angka payment.money.
    money-price-multiplier: 0.80
    stock-mode: GLOBAL
    default-stock: 1
    per-player-limit: 1

debug:
  spawn: false

npc:
  type: VILLAGER
  name: '&6Veliora Trader'
  silent: true
  gravity: true
  glowing: true
  offset:
    x: 0.5
    y: 1.0
    z: 1.5
  optional-skin:
    enabled: false

companion:
  enabled: true
  type: LLAMA
  frozen: true
  name: '&eTrader Companion'
  show-name: false
  offset:
    x: 3.0
    y: 1.0
    z: 1.5

# Camp/tenda dihapus: trader tidak lagi mengubah block dunia.
gui:
  title: '&8Veliora Trader'
  size: 27
  trade-slots: [10, 11, 13, 15, 16]
  close-slot: 26

sell-page:
  items:
    CARROT: 0.70
    EGG: 0.20
    LEATHER: 2.00
    MELON: 0.14
    MELON_SLICE: 0.03
    POTATO: 0.70
    PUMPKIN: 0.14
    TORCHFLOWER_SEEDS: 2.00
    WHEAT: 1.30
    WHEAT_SEEDS: 0.04

repair-block:
  enabled: true
  blocked-commands:
    - repair
    - fix
    - erepair
    - efix

permissions:
  use: 'veliorasuite.trader.use'
  admin: 'veliorasuite.trader.admin'
  reload: 'veliorasuite.trader.reload'

