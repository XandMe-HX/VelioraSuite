  no-permission: '%prefix% &cKamu tidak punya izin.'
  player-only: '%prefix% &cCommand ini hanya bisa digunakan oleh player.'
  reload-success: '%prefix% &aVelioraQuest berhasil direload.'
  quest-started: '%prefix% &aQuest &f%quest% &adimulai. Mana terpakai: &f%mana_cost%&a. Selesaikan targetnya dulu.'
  quest-progress: '%prefix% &eProgress &f%quest%&e: &f%progress%&7/&f%target%&e.'
  quest-ready-claim: '%prefix% &aQuest &f%quest% &aselesai. Claim reward dengan &f/quests claim %category%&a.'
  quest-auto-completed: '%prefix% &aQuest &f%quest% &aselesai. Reward &f%money% &amasuk. Level sekarang: &f%level%&a. Pilih quest lagi untuk lanjut dan memakai Mana lagi.'
  quest-claimed: '%prefix% &aReward quest &f%quest% &aberhasil diclaim. Kamu mendapat &f%money%&a. Pilih quest lagi untuk lanjut level berikutnya.'
  quest-level-up: '%prefix% &bQuest &f%quest% &bnaik ke level &f%level%&b.'
  quest-auto-restarted: '%prefix% &7Quest &f%quest% &7lanjut otomatis. Target baru: &f%target%&7.'
  quest-max-level: '%prefix% &6Quest &f%quest% &6sudah mencapai level maksimal &f100&6.'
  quest-not-active: '%prefix% &cQuest ini belum aktif. Pilih dulu lewat &f/quests&c atau &f/quests start <category>&c.'
  quest-already-active: '%prefix% &cQuest ini sedang aktif.'
  quest-not-ready: '%prefix% &cQuest ini belum selesai.'
  quest-disabled: '%prefix% &cQuest ini sedang dinonaktifkan.'
  mana-not-enough: '%prefix% &cMana kamu tidak cukup. Butuh &f%mana_cost% &cMana untuk mulai quest ini.'
  skills-not-found: '%prefix% &cMana system belum aktif. Aktifkan module VelioraSkills dulu.'
  vault-not-found: '%prefix% &eVault economy belum aktif, reward money dilewati.'
  quest-cancelled: '%prefix% &eQuest &f%quest% &edibatalkan. Mana yang sudah dipakai tidak dikembalikan.'
  starter-reminder:
    - '&8&m--------------------------------'
    - '&a&lStarter Quest'
    - '&7Selesaikan tugas awal supaya progres awalmu aman:'
    - '&fClaim Land: &e%claim_land% &7- Tutorial ada di TikTok &f@velioragardensofficial'
    - '&fSet Home: &e%set_home% &7- Gunakan &f/sethome &7di base kamu.'
    - '&fAmbil Kit Starter: &e%starter_kit% &7- Gunakan &f/kits starter'
    - '&8&m--------------------------------'
  help:
    - '&8&m--------------------------------'
    - '&a&lVelioraQuest'
    - '&f/quests &7- Buka GUI quest dan pilih quest.'
    - '&f/quests progress &7- Cek progress quest aktif.'
    - '&f/quests start <category> &7- Mulai quest manual dan memakai Mana.'
    - '&f/quests claim <category> &7- Claim manual untuk data lama yang stuck.'
    - '&f/quests cancel <category> &7- Batalkan quest.'
    - '&8&m--------------------------------'
  status:
    - '&8&m--------------------------------'
    - '&a&lVelioraQuest Status'
    - '&7Enabled: &f%enabled%'
    - '&7Skills Mana: &f%skills_mana%'
    - '&7Vault: &f%vault%'
    - '&7Categories: &f%categories%'
    - '&7Players Data: &f%players%'
    - '&8&m--------------------------------'
