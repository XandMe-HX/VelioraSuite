  top-damage-header: '&cTop Damage Boss:'
  reward-received: '%prefix% &aKamu mendapat reward boss karena memberi &f%damage% &adamage.'
  reward-money: '%prefix% &aKamu mendapat reward uang boss: &e%money%'
  reward-top-money: '%prefix% &aKamu mendapat bonus top damage: &e%money%'
  reward-no-economy: '%prefix% &cEconomy tidak tersedia, reward uang dilewati.'
  reward-money-total: '%prefix% &aTotal reward uang boss kamu: &e%money%'
