settings:
  enabled: true
  max-level: 50
  duplicate-exp: 50
  auto-summon-new-pet: false
  auto-summon-last-pet: false
  death-cooldown-minutes: 15
  allow-flying-pets: false
  follow:
    use-pathfinder: true
  flying-safe-mode:
    enabled: true
  economy:
    enabled: true
    gacha-price: 100000
    direct-buy:
      min-price: 100000
      max-price: 1000000

riding:
  enabled: true
  require-adult: true
  default-adult-level: 10
  allow-ride-active-only: true
  dismount-on-dismiss: true
  speed: 0.32
  jump-y: 0.42
  prevent-ride-in-combat: false
  rideable-rarities:
    common: true
    rare: true
    epic: true
    legendary: true
    mythic: true

sounds:
  quiet-pets: true
  silent-pets: true
  play-custom-summon-sound: true
  summon-sound: ENTITY_EXPERIENCE_ORB_PICKUP
  feed-sound: ENTITY_GENERIC_EAT
  volume: 0.25
  pitch: 1.2

leveling:
  scale-per-level: 0.003
  max-scale-bonus: 0.15

gacha:
  chance:
    common: 55.0
    rare: 25.0
    epic: 12.0
    legendary: 6.0
    mythic: 2.0

storage:
  allow-storage-without-active: false
  size:
    common: 9
    rare: 9
    epic: 18
    legendary: 18
    mythic: 27

combat:
  enabled: true
  attack-range: 3.0
  attack-cooldown-seconds: 2
  allow-attack-passive: false
  allow-attack-players: false
  pet-damage-multiplier: 1.0

cosmetic:
  aura-enabled: true
  aura-interval-seconds: 5
  glow-enabled: false
  particles-low-lag: true
  aura-particle: HAPPY_VILLAGER

