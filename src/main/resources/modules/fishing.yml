settings:
  enabled: true
  prefix: '&8[&bVelioraFishing&8] '

  rarity-chance:
    trash: 18.0
    vanilla: 16.0
    common: 56.0
    ornamental: 6.0
    epic: 3.5
    legendary: 0.40
    mitologi: 0.10

  price:
    trash: {min: 1, max: 1, max-final: 1}
    vanilla: {min: 15, max: 40, max-final: 50}
    common: {min: 100, max: 170, max-final: 225}
    ornamental: {min: 350, max: 700, max-final: 900}
    epic: {min: 1800, max: 3200, max-final: 4200}
    legendary: {min: 12000, max: 18000, max-final: 24000}
    mitologi: {min: 35000, max: 55000, max-final: 70000}

  minigame:
    enabled: true
    trigger-chance: 100.0
    mode: SPAM_CLICK
    click-cooldown-ms: 40
    show-title: true
    remove-vanilla-caught-entity: true
    difficulty:
      trash: {enabled: false, spam-needed: 0, seconds: 0.0}
      vanilla: {enabled: true, spam-needed: 3, seconds: 6.0}
      common: {enabled: true, spam-needed: 5, seconds: 8.0}
      ornamental: {enabled: true, spam-needed: 8, seconds: 10.0}
      epic: {enabled: true, spam-needed: 12, seconds: 12.0}
      legendary: {enabled: true, spam-needed: 18, seconds: 16.0}
      mitologi: {enabled: true, spam-needed: 25, seconds: 20.0}

  sell-gui:
    enabled: true
    title: '&8VelioraFishing Sell'
    size: 54
    allow-vanilla-fish: true

  bag:
    enabled: true
    title: '&8Fish Bag'
    size: 54
    auto-store:
      enabled: false
      rarities: [ORNAMENTAL, EPIC, LEGENDARY, MITOLOGI]

  collection:
    title: '&8Fish Collection'
    size: 54

  top:
    limit: 5
    gui-enabled: false

  quest-integration:
    enabled: true

effects:
  ornamental: {enabled: true, sound: ENTITY_EXPERIENCE_ORB_PICKUP, particle: HAPPY_VILLAGER, amount: 10}
  epic: {enabled: true, sound: ENTITY_PLAYER_LEVELUP, particle: ENCHANT, amount: 20}
  legendary: {enabled: true, sound: UI_TOAST_CHALLENGE_COMPLETE, particle: TOTEM_OF_UNDYING, amount: 35, broadcast: true}
  mitologi: {enabled: true, sound: ENTITY_ENDER_DRAGON_GROWL, particle: DRAGON_BREATH, amount: 60, visual-lightning: true, broadcast: true}

permissions:
  use: 'veliorasuite.fishing.use'
  sell: 'veliorasuite.fishing.sell'
  bag: 'veliorasuite.fishing.bag'
  top: 'veliorasuite.fishing.top'
  admin: 'veliorasuite.fishing.admin'
  reload: 'veliorasuite.fishing.reload'

