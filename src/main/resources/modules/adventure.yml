config-version: 1

settings:
  enabled: true
  hide-member-commands: true

# Profesi Petualang: adaptasi ringan dari konsep UJobs, tetapi terhubung ke
# /vgpetualang dan tidak membuat listener/reward Jobs kedua yang dapat dobel.
professions:
  enabled: true
  max-level: 50
  level-exp: 100
  xp:
    mining: 3
    foraging: 2
    farming: 2
    hunting: 2

# XP AuraSkills ikut mengisi level/rank Petualang. Fighting sengaja mati supaya
# pukul-pukul mob tidak dapat menjadi jalan pintas menaikkan Petualang.
integrations:
  auraskills:
    enabled: true
    xp-to-adventure-ratio: 0.15
    minimum-source-xp: 1.0
    skills:
      farming: true
      foraging: true
      mining: true
      fishing: true
      excavation: true
      fighting: false
      defense: false
      archery: false

daily:
  timezone: Asia/Jakarta
  quest-count: 5
  reset-hour: 0
  # Jika tidak ada progres sama sekali selama 15 menit, misi otomatis hangus.
  inactivity-expire-minutes: 15

team:
  # Team satu orang tetap boleh mengambil dan menyelesaikan misi.
  minimum-online-members: 1

locations:
  world: world
  min: -2000
  max: 2000
  completion-radius: 20
  mob-activation-radius: 48
  # Kill/mining/farming quest hanya dihitung di sekitar koordinat misi.
  objective-radius: 96
  spawn-quest-mobs: true
  max-spawned-mobs: 20

anti-farm:
  # Menahan macro yang mengirim progres terlalu cepat, tanpa mengganggu main normal.
  max-progress-per-second: 12

level:
  max: 100
  base-exp: 500
  growth-exp: 75

ranks:
  F:
    display: '&8[&#9A9A9A&lF&8]'
    required-exp: 0
  E:
    display: '&8[&#72F28D&lE&8]'
    required-exp: 2500
  D:
    display: '&8[&#45D6FF&lD&8]'
    required-exp: 7500
  C:
    display: '&8[&#4D8DFF&lC&8]'
    required-exp: 20000
  B:
    display: '&8[&#A86BFF&lB&8]'
    required-exp: 50000
  A:
    display: '&8[&#FFD34D&lA&8]'
    required-exp: 100000
  S:
    display: '&8[&#FF4D6D&lS&8]'
    required-exp: 200000
  SS:
    display: '&8[&#FF56CB&lS&#B15CFF&lS&8]'
    required-exp: 400000
  SSS:
    display: '&8[&#FF4D5F&lS&#FF9B45&lS&#FFE14D&lS&8]'
    required-exp: 750000

gui:
  main-title: '&8Guild Petualang'
  quests-title: '&8Misi Hari Ini'
  submit-title: '&8Setor dan Riwayat'
  team-title: '&8Team Petualang'

messages:
  prefix: '&8[&aVeliora Petualang&8] &r'
  team-required: '&cKamu harus memiliki team terlebih dahulu.'
  team-online-required: '&cMinimal &f%amount% &canggota team harus online.'
  quest-active: '&cTeam kamu sudah mempunyai misi aktif.'
  quest-not-daily: '&cMisi itu tidak tersedia hari ini.'
  quest-not-ready: '&cMisi belum siap disetor.'
  quest-expired: '&cMisi telah kedaluwarsa.'
  rank-too-low: '&cRank kamu belum cukup. Butuh rank &f%rank%&c.'
  quest-reward: '&aMisi selesai! Hadiah: &f$%money% &7+ &b%exp% EXP &7+ &b%mana% Mana.'
  guide-cooldown: '&ePanduan bisa dibuka lagi dalam &f%seconds% detik&e.'
  team-create-guide: '&eBuat team dengan &f/team create <nama>&e.'
  team-invite-guide: '&eUndang teman dengan &f/team invite <nama>&e.'
  guide:
    - '&8&m--------------------------------'
    - '&a&lGUILD PETUALANG'
    - '&7Buat team dan pastikan minimal 2 anggota online.'
    - '&7Buka NPC misi, pilih satu dari 5 misi harian.'
    - '&7Ikuti koordinat dan selesaikan target bersama.'
    - '&7Kembali ke NPC misi untuk menyetor hadiah.'
    - '&7Misi berganti setiap pukul 00.00 WIB.'
    - '&8&m--------------------------------'

